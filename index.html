<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İz Peşinde — DM Macera Rehberi</title>
  <style>
    :root {
      --bg: #f7f1e5;
      --surface: #ede4d2;
      --surface-alt: #e4d8c1;
      --primary: #6e221b;
      --primary-hover: #8a2c23;
      --accent: #967346;
      --border: #c9b592;
      --text: #231e1c;
      --muted: #5a4d44;
      --sidebar-w: 290px;
      --font-serif: Georgia, 'Liberation Serif', 'Times New Roman', serif;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-serif);
      font-size: 16.5px;
      line-height: 1.68;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout Shell */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Mobile Topbar */
    .mobile-header {
      display: none;
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 2px solid var(--primary);
      padding: 10px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .mobile-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--primary);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .menu-btn {
      background: var(--primary);
      color: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 6px 12px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-brand {
      padding: 18px 16px 14px;
      border-bottom: 2px solid var(--primary);
      background: linear-gradient(180deg, rgba(110, 34, 27, 0.08) 0%, transparent 100%);
    }
    .sidebar-brand .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3px;
    }
    .sidebar-brand h1 {
      margin: 0;
      font-size: 1.35rem;
      color: var(--primary);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .sidebar-brand .sub {
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
      margin-top: 4px;
    }

    .search-wrap {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
    }

    .nav-tree {
      padding: 10px 10px 28px;
      flex: 1;
    }
    .nav-group {
      margin-bottom: 14px;
    }
    .nav-group-title {
      font-family: var(--font-sans);
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--accent);
      padding: 4px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 5px;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }
    .nav-item:hover {
      background: var(--surface-alt);
      color: var(--primary);
    }
    .nav-item.active {
      background: var(--primary);
      color: var(--bg);
      font-weight: 600;
    }
    .nav-sub-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-left: 2px solid var(--border);
      padding: 4px 10px 4px 14px;
      margin-left: 10px;
      font-family: var(--font-sans);
      font-size: 0.81rem;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
    }
    .nav-sub-item:hover {
      color: var(--primary);
      border-left-color: var(--primary);
    }
    .nav-badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(150, 115, 70, 0.22);
      color: var(--muted);
      margin-left: 6px;
      vertical-align: middle;
    }
    .nav-item.active .nav-badge {
      background: rgba(247, 241, 229, 0.22);
      color: var(--bg);
    }

    /* Main Content */
    .main-wrap {
      flex: 1;
      min-width: 0;
      padding: 28px 34px 64px;
    }
    .content-container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* Back Bar */
    .back-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }
    .back-btn:hover { background: var(--primary-hover); }
    .breadcrumb {
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* Banner & Typography */
    .module-banner {
      border-top: 3px solid var(--primary);
      border-bottom: 3px solid var(--primary);
      padding: 18px 14px 16px;
      margin-bottom: 22px;
      text-align: center;
      background: linear-gradient(180deg, rgba(150, 115, 70, 0.1) 0%, rgba(150, 115, 70, 0.02) 100%);
    }
    .module-banner .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .module-banner h2 {
      margin: 0 0 6px;
      font-size: 1.85rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      border: none;
      padding: 0;
    }
    .module-banner .subtitle {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
      font-style: italic;
    }

    h2.section-title {
      font-size: 1.35rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 5px;
      margin: 28px 0 14px;
    }
    h3.scene-title {
      font-size: 1.15rem;
      color: var(--primary);
      margin: 22px 0 8px;
      scroll-margin-top: 20px;
    }
    p { margin: 0 0 12px; }
    ul { margin: 0 0 14px; padding-left: 22px; }
    li { margin-bottom: 6px; }

    /* Entity Links */
    a.entity-link {
      color: var(--primary);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-underline-offset: 3px;
      cursor: pointer;
    }
    a.entity-link:hover {
      background: rgba(150, 115, 70, 0.16);
      border-radius: 2px;
    }

    /* Callouts & Boxes */
    .callout {
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      padding: 14px 18px;
      margin: 18px 0;
    }
    .callout-title {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .read-aloud {
      background: rgba(150, 115, 70, 0.1);
      border-left: 3.5px solid var(--accent);
      padding: 12px 16px;
      margin: 14px 0;
      font-style: italic;
    }
    .placeholder-box {
      border: 1.5px dashed var(--primary);
      background: rgba(110, 34, 27, 0.04);
      padding: 14px 18px;
      margin: 18px 0;
      border-radius: 4px;
    }
    .placeholder-label {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    /* Entity Detail Page */
    .entity-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-top: 4px solid var(--primary);
      border-radius: 4px;
      padding: 20px 22px;
      margin-bottom: 20px;
    }
    .entity-type-tag {
      font-family: var(--font-sans);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .entity-card h2 {
      margin: 0 0 6px;
      font-size: 1.6rem;
      color: var(--primary);
    }
    .entity-meta {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--muted);
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 14px 0 18px;
    }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: center;
      padding: 8px 4px;
      font-family: var(--font-sans);
    }
    .stat-box .lbl {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-box .val {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
    }
    .stat-box .mod {
      font-size: 0.8rem;
      color: var(--text);
    }

    .detail-block {
      margin-bottom: 14px;
    }
    .detail-block h4 {
      font-family: var(--font-sans);
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin: 0 0 4px;
    }

    .related-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-family: var(--font-sans);
      font-size: 0.86rem;
    }

    /* Mobile Drawer */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 14, 12, 0.5);
      z-index: 45;
    }
    .drawer-backdrop.open { display: block; }

    @media (max-width: 899px) {
      .app-shell { flex-direction: column; }
      .mobile-header { display: flex; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: 4px 0 18px rgba(0, 0, 0, 0.22);
      }
      .sidebar.open { transform: translateX(0); }
      .main-wrap { padding: 18px 16px 48px; }
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="mobile-header">
    <div class="mobile-title">İz Peşinde • DM Rehberi</div>
    <button type="button" class="menu-btn" id="mobileMenuBtn">☰ İçindekiler</button>
  </div>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="eyebrow">Lands of Exile • 1v1 Solo</div>
        <h1>İz Peşinde</h1>
        <div class="sub">Oynatılabilir DM Modül Rehberi</div>
      </div>
      <div class="search-wrap">
        <input type="search" class="search-input" id="searchInput" placeholder="Bölüm, NPC veya mekân ara...">
      </div>
      <nav class="nav-tree" id="navTree"></nav>
    </aside>

    <main class="main-wrap">
      <div class="content-container" id="mainContent"></div>
    </main>
  </div>

  <script>
    // =========================================================================
    // GENİŞLETİLEBİLİR VERİ YAPISI (ADVENTURE_DATA)
    // Yeni bölümler çıktıkça 'chapters' dizisine ekleyebilir, var olan NPC ve
    // mekânların bilgilerini 'entities' altından güncelleyebilirsiniz.
    // =========================================================================
    let ADVENTURE_DATA = { chapters: [], entities: {} };

    // =========================================================================
    // NAVİGASYON, TARİHÇE YIĞINI (SCROLL KORUMALI) VE RENDER MANTIĞI
    // =========================================================================
    const navTree = document.getElementById("navTree");
    const mainContent = document.getElementById("mainContent");
    const searchInput = document.getElementById("searchInput");
    const sidebar = document.getElementById("sidebar");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");

    let currentRoute = "bolum-1";
    const navHistory = []; // { route, scrollY, title }

    function closeMobileDrawer() {
      sidebar.classList.remove("open");
      drawerBackdrop.classList.remove("open");
    }

    mobileMenuBtn.addEventListener("click", () => {
      sidebar.classList.add("open");
      drawerBackdrop.classList.add("open");
    });
    drawerBackdrop.addEventListener("click", closeMobileDrawer);

    function getRouteTitle(route) {
      const ch = ADVENTURE_DATA.chapters.find(c => c.id === route);
      if (ch) return ch.title;
      const ent = ADVENTURE_DATA.entities[route];
      if (ent) return ent.title;
      return "İz Peşinde";
    }

    function navigateTo(route, options = {}) {
      const { pushHistory = true, restoreScrollY = null, scrollTargetId = null } = options;
      if (pushHistory && route !== currentRoute) {
        navHistory.push({
          route: currentRoute,
          scrollY: window.scrollY || window.pageYOffset || 0,
          title: getRouteTitle(currentRoute)
        });
      }
      currentRoute = route;
      if (window.location.hash !== "#" + route) {
        try { history.replaceState(null, "", "#" + route); } catch (e) {}
      }
      renderMain();
      renderSidebar(searchInput.value);
      closeMobileDrawer();

      requestAnimationFrame(() => {
        if (restoreScrollY !== null) {
          window.scrollTo({ top: restoreScrollY, behavior: "instant" });
        } else if (scrollTargetId) {
          const el = document.getElementById(scrollTargetId);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          else window.scrollTo(0, 0);
        } else {
          window.scrollTo(0, 0);
        }
      });
    }

    function goBack() {
      if (navHistory.length === 0) {
        navigateTo("bolum-1", { pushHistory: false });
        return;
      }
      const prev = navHistory.pop();
      navigateTo(prev.route, { pushHistory: false, restoreScrollY: prev.scrollY });
    }

    function renderSidebar(filterText = "") {
      const q = filterText.trim().toLowerCase();
      let html = "";

      // Bölümler
      const matchingChapters = ADVENTURE_DATA.chapters.filter(c =>
        !q || c.title.toLowerCase().includes(q) || c.scenes.some(s => s.title.toLowerCase().includes(q))
      );
      if (matchingChapters.length) {
        html += `<div class="nav-group"><div class="nav-group-title">Bölümler</div>`;
        matchingChapters.forEach(ch => {
          const active = currentRoute === ch.id ? "active" : "";
          html += `<button type="button" class="nav-item ${active}" data-nav="${ch.id}">${ch.title}<span class="nav-badge">${ch.badge}</span></button>`;
          if (currentRoute === ch.id || q) {
            ch.scenes.forEach(sc => {
              if (!q || sc.title.toLowerCase().includes(q)) {
                html += `<button type="button" class="nav-sub-item" data-chapter="${ch.id}" data-scene="${sc.id}">${sc.title}</button>`;
              }
            });
          }
        });
        html += `</div>`;
      }

      // Kategoriler: NPC, Mekan, Kurallar
      const groups = [
        { key: "npc", label: "Karakterler & NPC'ler" },
        { key: "location", label: "Mekânlar" },
        { key: "rule", label: "Kurallar & Evren" }
      ];
      groups.forEach(g => {
        const items = Object.entries(ADVENTURE_DATA.entities).filter(([, ent]) =>
          ent.category === g.key && (!q || ent.title.toLowerCase().includes(q) || ent.meta.toLowerCase().includes(q))
        );
        if (items.length) {
          html += `<div class="nav-group"><div class="nav-group-title">${g.label}</div>`;
          items.forEach(([id, ent]) => {
            const active = currentRoute === id ? "active" : "";
            html += `<button type="button" class="nav-item ${active}" data-nav="${id}">${ent.title}</button>`;
          });
          html += `</div>`;
        }
      });

      if (!html) {
        html = `<div style="padding:12px;font-family:var(--font-sans);font-size:0.85rem;color:var(--muted);">Eşleşen kayıt bulunamadı.</div>`;
      }
      navTree.innerHTML = html;
    }

    function renderMain() {
      const ch = ADVENTURE_DATA.chapters.find(c => c.id === currentRoute);
      if (ch) {
        let backHtml = "";
        if (navHistory.length > 0) {
          const prev = navHistory[navHistory.length - 1];
          backHtml = `
            <div class="back-bar">
              <button type="button" class="back-btn" id="backBtn">↩ Geri Dön: ${prev.title}</button>
              <span class="breadcrumb">İz Peşinde / ${ch.title}</span>
            </div>`;
        }
        mainContent.innerHTML = backHtml + ch.html;
        return;
      }

      const ent = ADVENTURE_DATA.entities[currentRoute];
      if (ent) {
        const prev = navHistory.length > 0 ? navHistory[navHistory.length - 1] : null;
        const backLabel = prev ? `↩ Akışa Dön (${prev.title})` : "↩ Bölüm 1'e Git";

        let statsHtml = "";
        if (ent.stats && ent.stats.length) {
          statsHtml = `<div class="stat-grid">` + ent.stats.map(s => `
            <div class="stat-box">
              <div class="lbl">${s.lbl}</div>
              <div class="val">${s.val}</div>
              <div class="mod">${s.mod}</div>
            </div>`).join("") + `</div>`;
        }

        const sectionsHtml = ent.sections.map(sec => `
          <div class="detail-block">
            <h4>${sec.heading}</h4>
            <p>${sec.body}</p>
          </div>`).join("");

        const appearHtml = ent.appearances && ent.appearances.length
          ? `<div class="related-links"><strong>Geçtiği Yerler:</strong> ` +
            ent.appearances.map(a => `<a class="entity-link" href="#${a.chapterId}" data-route="${a.chapterId}">${a.label}</a>`).join(" • ") +
            `</div>`
          : "";

        mainContent.innerHTML = `
          <div class="back-bar">
            <button type="button" class="back-btn" id="backBtn">${backLabel}</button>
            <span class="breadcrumb">İz Peşinde / ${ent.title}</span>
          </div>
          <article class="entity-card">
            <div class="entity-type-tag">${ent.typeLabel}</div>
            <h2>${ent.title}</h2>
            <div class="entity-meta">${ent.meta}</div>
            ${statsHtml}
            ${sectionsHtml}
            ${appearHtml}
          </article>`;
      }
    }

    // Event Delegation
    navTree.addEventListener("click", (e) => {
      const navBtn = e.target.closest("[data-nav]");
      if (navBtn) {
        navigateTo(navBtn.getAttribute("data-nav"));
        return;
      }
      const subBtn = e.target.closest("[data-scene]");
      if (subBtn) {
        const chId = subBtn.getAttribute("data-chapter");
        const scId = subBtn.getAttribute("data-scene");
        navigateTo(chId, { pushHistory: currentRoute !== chId, scrollTargetId: scId });
      }
    });

    mainContent.addEventListener("click", (e) => {
      const link = e.target.closest("a.entity-link");
      if (link) {
        e.preventDefault();
        navigateTo(link.getAttribute("data-route"));
        return;
      }
      if (e.target.closest("#backBtn")) {
        goBack();
      }
    });

    searchInput.addEventListener("input", (e) => {
      renderSidebar(e.target.value);
    });

    window.addEventListener("hashchange", () => {
      const hash = window.location.hash.replace(/^#/, "");
      if (hash && (ADVENTURE_DATA.entities[hash] || ADVENTURE_DATA.chapters.some(c => c.id === hash))) {
        if (hash !== currentRoute) navigateTo(hash, { pushHistory: false });
      }
    });

    // İlk yükleme (data.json üzerinden dinamik)
    async function initAdventure() {
      try {
        const response = await fetch("./data.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        ADVENTURE_DATA = await response.json();
        const initialHash = window.location.hash.replace(/^#/, "");
        if (initialHash && (ADVENTURE_DATA.entities[initialHash] || ADVENTURE_DATA.chapters.some(c => c.id === initialHash))) {
          currentRoute = initialHash;
        }
        renderSidebar();
        renderMain();
      } catch (err) {
        mainContent.innerHTML = `
          <div class="callout">
            <div class="callout-title">Veri Dosyası (data.json) Yüklenemedi</div>
            <p>Tarayıcı güvenlik politikaları (CORS) nedeniyle <code>file://</code> protokolü üzerinden <code>data.json</code> dosyası doğrudan okunamıyor olabilir.</p>
