                  "html": "\n            <div class=\"module-banner\">\n              <div class=\"eyebrow\">İz Peşinde • Oyun Yöneticisi Modülü • 5. Oturum</div>\n              <h2>Bölüm 5: Süren Tahkikat</h2>\n              <p class=\"subtitle\">6 Günlük Demirbaş Oyunu, Karakol Donanımı ve Tepeli Ambar'da İkinci Kanlı Saldırı</p>\n            </div>\n\n            <div class=\"callout\">\n              <div class=\"callout-title\">Bürokratik Kalkan: 6 Günlük Demirbaş Sayımı</div>\n              <p style=\"margin-bottom:0;\">4. bölüm özetini eksiksiz yapan oyuncuya DM tarafından <strong>+1 Inspiration</strong> verilir. Bu bölümde <a class=\"entity-link\" href=\"#npc-godfrey\" data-route=\"npc-godfrey\">Godfrey</a>, <a class=\"entity-link\" href=\"#npc-jaret-von-dafflin\" data-route=\"npc-jaret-von-dafflin\">Jaret von Dafflin</a> ve <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>, testiyi isteyen güçleri açığa çıkarmak için Engizisyon bürokrasisini kullanan zekice bir <strong>Sahte Testi Planı</strong> kurarlar.</p>\n            </div>\n\n            <h2 class=\"section-title\">Bölüm Akışı</h2>\n\n            <h3 class=\"scene-title\" id=\"b5-s1\">Sahne 1: Şafak Öncesi Gizli Toplantı ve Sahte Testi Planı</h3>\n            <p>Gün doğmadan <a class=\"entity-link\" href=\"#npc-godfrey\" data-route=\"npc-godfrey\">Godfrey</a>'in duman altı odasında Godfrey, karakolun yeni vekil komutanı <a class=\"entity-link\" href=\"#npc-jaret-von-dafflin\" data-route=\"npc-jaret-von-dafflin\">Avcı Kaptan Jaret von Dafflin</a> ve <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a> gizlice toplanır (<strong>Insight: 12</strong>).</p>\n\n            <ul>\n              <li><strong>Sahte Testi ve 6 Günlük Demirbaş Planı:</strong>\n                <ul>\n                  <li>Jaret görevi devraldığında Engizisyon kanunu gereği <strong>6 gün süren resmi demirbaş sayımı</strong> başlatacaktır. Bu 6 gün boyunca karakoldan dışarıya hiçbir resmi evrak veya emanet çıkışı yapılamaz.</li>\n                  <li>Godfrey kuzeye sürgüne giderken yanına gerçek testiye birebir benzeyen <strong>boş/sahte bir testi</strong> alacak (böylece yolda pusu kuracak olanlar boş testiyi ele geçirecektir).</li>\n                  <li>Gerçek mühürlü testi ise Jaret'in kasasında kalacak; 6. günün sonunda Jaret testinin \"kayıp\" olduğunu merkeze bildirecektir. Bu bildirim üzerine merkezden hangi müfettişin gönderileceği, Engizisyon içindeki köstebeği de açık edecektir!</li>\n                </ul>\n              </li>\n              <li><strong>Alarik'in Yeni Görevi ve İrtibatlar:</strong> Alarik'e bu 6 günlük sürede <a class=\"entity-link\" href=\"#loc-tepeli-ambar\" data-route=\"loc-tepeli-ambar\">Tepeli Ambar</a>'a dönüp <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Peder Martin</a> cinayetini çözme emri ve kasabadaki iki gizli Engizisyon irtibatının adı verilir:\n                <ol>\n                  <li><a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Faytoncu Yanik</a> (10 yıllık güvenilir muhbir),</li>\n                  <li><a class=\"entity-link\" href=\"#npc-kasap-roland\" data-route=\"npc-kasap-roland\">Kasap Roland</a> (aşırı dindarlığı yüzünden erken emekli edilmiş eski lejyoner).</li>\n                </ol>\n              </li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b5-s2\">Sahne 2: Karakol Hazırlıkları — Tüfekçi Rorik, Simyacı Konrad ve Gözcü</h3>\n            <p>Yola çıkmadan önce Alarik, karakolun uzmanlarından özel ekipman ve istihbarat toplar:</p>\n\n            <ul>\n              <li><strong>Cephanelik — <a class=\"entity-link\" href=\"#npc-tufekci-rorik\" data-route=\"npc-tufekci-rorik\">Tüfekçi Rorik</a> (Insight: 12 + 7 = 19):</strong> Kafası kazınmış, gözlüklü, bembeyaz tenli ve patlama takıntılı avcı Rorik, Alarik'e şunları teslim eder:\n                <ul>\n                  <li><strong>İki katmanlı monoküler dürbün</strong>,</li>\n                  <li><strong>2 adet fitilli el bombası</strong> (fitili sökülüp barut olarak da kullanılabilir),</li>\n                  <li>Metal bir puro tüpü içinde <strong>3 adet kutsanmış mermi</strong> (Alarik'in elindeki 1 kutsanmış mermiyle birlikte toplam <strong>4 kutsanmış mermisi</strong> olur).</li>\n                </ul>\n              </li>\n              <li><strong>Simya Atölyesi — <a class=\"entity-link\" href=\"#npc-simyaci-konrad\" data-route=\"npc-simyaci-konrad\">Kardeş Konrad</a> (Nature: 16 / INT: 3):</strong> Sağlıklı görünmesine rağmen dişleri ve tırnakları zehirden sapsarı olmuş simyacı avcı Konrad, Alarik'e üç özel karışım verir:\n                <ul>\n                  <li><strong>Hakikat Serumu</strong> (acı-tatlı sıvı),</li>\n                  <li><strong>Kan Koyulaştırıcı Panzehir (Kil Hapı)</strong> (Martin'in kan boşalmasıyla ölümüne karşı önlem olarak),</li>\n                  <li><strong>Tatsız ve Kokusuz Ölüm Zehri</strong> (çalkalanınca şeffaflaşan siyah sıvı; kurban öldükten 4 saat sonra bedende hiçbir iz bırakmaz).</li>\n                </ul>\n              </li>\n              <li><strong>3 Numaralı Hücre — <a class=\"entity-link\" href=\"#npc-gozcu\" data-route=\"npc-gozcu\">Gözcü</a>'nün İstiharesi ve Yadigar Tesbih:</strong> Alarik tekrar Gözcü'ye iner. Gözcü, istihare rüyasında Peder Martin'in mezar taşında siyah bir ziftle <strong>\"Amnestia Omnibus\"</strong> (<em>Af Herkes İçin</em>) yazdığını ve ziftin toprağa damladığını gördüğünü anlatır. Ayrıca Alarik'e kendi üstadından kalma, üzerinde 4 büyük meleğin ve diğer meleklerin isimleri yazılı <a class=\"entity-link\" href=\"#kural-yadigar-tesbih\" data-route=\"kural-yadigar-tesbih\">4 İmameli Yadigar Tesbih (Rosary)</a> hediye eder.</li>\n              <li><strong>Açık Yem Gösterisi (Insight: 14 + 7 = 21):</strong> Alarik, okuma yazma bilmediği halde açık <em>Codex Deus</em> sayfalarına bakan <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Haldo</a>'yu yanına alır ve dün Piskopos karşısında bayılan yaşlı yobaza çantalarını yükleterek <strong>yanında testi olmadan yola çıktığını</strong> karakoldaki herkese alenen gösterir.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b5-s3\">Sahne 3: Yolda Yaşlı Çerçi ve Tepeli Ambar'da Kasap Roland</h3>\n            <p><strong>Zar Kontrolü — Survival (Avantajlı: 4/4 + 5 = 9) & Şans Zarı (d20: 13) & Perception (10 + 7 = 17):</strong> Kötü hava ve çamurlu yolda ilerlerken gece kampına eşekli, belinde açıkça gürz taşıyan <a class=\"entity-link\" href=\"#npc-yasli-cerci\" data-route=\"npc-yasli-cerci\">Yaşlı Çerçi</a> gelir.</p>\n\n            <ul>\n              <li><strong>Çerçi ile Alışveriş:</strong> Alarik 5 altın ödeyerek Haldo'ya sert ispirto, atlara kırma çavdar, Mavi Koru'dan ithal yağlı tütün ve kuru erzak alır. Çerçinin votka ikramını görevde olduğu için reddedince, çerçi yol adeti gereği Alarik'e bedavaya bir <strong>Piton Kiti (tırmanma kancaları ve çivileri)</strong> hediye eder.</li>\n              <li><strong>Tepeli Ambar Mezarlığı (Şans Zarı d20: 11 & Insight: Doğal 20 + 7 = 27):</strong> Kasabaya varan Alarik, <a class=\"entity-link\" href=\"#npc-welford\" data-route=\"npc-welford\">Welford</a>'u ziyaret eder. Welford, Alarik yanındayken kendini ilk kez güvende hissettiğini söyler ve önemli bir haber verir: Muhtar Richmund Sermon'un damadı <a class=\"entity-link\" href=\"#npc-otto-adren\" data-route=\"npc-otto-adren\">Otto Adren</a>, yüzü asık bir halde mezarlığa gelerek <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>'in ölümünü ve nereye gömüldüğünü sormuştur!</li>\n              <li><strong>Kasap Roland ve Kızı Tiffany:</strong> Alarik, irtibatı olan 40'larındaki eski lejyoner <a class=\"entity-link\" href=\"#npc-kasap-roland\" data-route=\"npc-kasap-roland\">Kasap Roland</a>'ın dükkanına gider. Dükkanda Roland'ın 10 yaşındaki hasta kızı <strong>Tiffany</strong> kendi boyu kadar kasap bıçaklarını bilemektedir. Roland, Peder Martin'in Tiffany'ye şifalı ilaçlar yaptığını, son gelişinde ise kimseye yük olmamak için <strong>ambar çatısında</strong> yattığını duyup kasabalıya çok kızdığını anlatır; esnafı ve yabancıları gözetlemeyi kabul eder.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b5-s4\">Sahne 4: Faytoncu Yanik ve Muhtarın Karısı Marinette Sermon</h3>\n            <p><strong>Zar Kontrolü — Şans Zarı (d20: 17):</strong> Alarik, <a class=\"entity-link\" href=\"#loc-canavar-magarasi\" data-route=\"loc-canavar-magarasi\">Canavar Mağarası</a> mahallesindeki amele pazarında ikinci irtibatı olan sivri yüzlü, kemerli burunlu <a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Faytoncu Yanik ('Şerefsiz Yanik')</a>'i bulur ve ara sokağa çeker.</p>\n\n            <ul>\n              <li><strong>Yanik'in İstihbaratı (Insight: 12 + 7 = 19 ve 15 + 7 = 22):</strong> Yanik, <a class=\"entity-link\" href=\"#npc-piskopos-caligus\" data-route=\"npc-piskopos-caligus\">Yüksek Piskopos Caligus</a>'un <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'daki <strong>Larvos Hanesi düğününe</strong> bizzat katılıp şehri kutsadığını bildirir. Ayrıca kasabadaki Terzi Willy'ye söver ve Tiefling <a class=\"entity-link\" href=\"#npc-falkret\" data-route=\"npc-falkret\">Falkret</a>'in mahalledeki fakirlere düzenli yemek dağıttığını doğrular. Alarik, Yanik'i kasabadaki şüpheli hareketleri ve Otto Adren'i araştırması için görevlendirir.</li>\n              <li><strong>Sermon Konağı Ziyareti (Insight: 15):</strong> Alarik, <a class=\"entity-link\" href=\"#loc-sermon-konagi\" data-route=\"loc-sermon-konagi\">Sermon Konağı</a>'na gider; kapıyı yaşlı hizmetçi <strong>Gabriana</strong> açar. Varaklı mobilyalar ve aile tablolarıyla dolu salonda <a class=\"entity-link\" href=\"#npc-marinette-sermon\" data-route=\"npc-marinette-sermon\">Marinette Sermon</a> ile görüşür. Marinette, eski konak arşivlerinde Peder Martin'inki gibi kan boşalmasıyla gerçekleşen ölüm kayıtlarını araştırmayı kabul eder ve en büyük üvey kızının kocası olan damat <a class=\"entity-link\" href=\"#npc-otto-adren\" data-route=\"npc-otto-adren\">Otto Adren</a>'den şahsi bir nefretle bahseder.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b5-s5\">Sahne 5: Gizemli Kumaş Tüccarı Arlen ve Mezarlık Kapısında Kanlı Kriz</h3>\n            <p>Akşam <a class=\"entity-link\" href=\"#loc-tepeli-ambar-mezarligi\" data-route=\"loc-tepeli-ambar-mezarligi\">Tepeli Ambar Mezarlığı</a> kulübesine dönen Alarik'i içeride beklenmedik bir misafir karşılar: Uzun siyah saçlı, kırık beyaz seyahat kıyafetli, gümüş mücevherli ve <strong>sol gözünün kenarında derin bir kesik izi</strong> bulunan <a class=\"entity-link\" href=\"#npc-arlen\" data-route=\"npc-arlen\">Arlen</a>.</p>\n\n            <ul>\n              <li><strong>Arlen'in Tanışması:</strong> Arlen kendisini Peder Martin'in geçmişte hayatını kurtardığı eğitimli bir kumaş tüccarı olarak tanıtır; rahibin ölüm şeklinin sıradan bir zehirden ziyade <strong>büyülü bir hünere</strong> işaret ettiğini söyler.</li>\n              <li><strong>Mezarlık Kapısında Kanlı Kriz (Cliffhanger):</strong> Tam bu sırada kulübenin kapısı deli gibi yumruklanır! Kapı açıldığında <a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Faytoncu Yanik</a>, tıpkı Peder Martin gibi burnundan ve ağzından oluk oluk kan fışkırarak içeri yığılır!\n                <ul>\n                  <li>Alarik refleksle Yanik'in üzerine atlayıp <a class=\"entity-link\" href=\"#npc-simyaci-konrad\" data-route=\"npc-simyaci-konrad\">Simyacı Konrad</a>'dan aldığı <strong>kan koyulaştırıcı kil hapını</strong> zorla boğazından aşağı tıkar.</li>\n                  <li>Hemen ardından <a class=\"entity-link\" href=\"#npc-arlen\" data-route=\"npc-arlen\">Arlen</a> öne atılır; gözleri hafifçe parlayarak eski tapınak ilahilerini andıran kadim sözler fısıldar ve Yanik'e dokunarak <strong>kanı damarlarında dondurup sabitler</strong>!</li>\n                  <li>Yanik'in kanaması durur; ancak yanı başında izinsiz büyü yapıldığını gören Cadı Avcısı <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>, elini tabancasına atarak ölümcül bakışlarla Arlen ile göz göze gelir!</li>\n                </ul>\n              </li>\n            </ul>\n        "
            },

                  "html": "\n            <div class=\"module-banner\">\n              <div class=\"eyebrow\">İz Peşinde • Oyun Yöneticisi Modülü • 6. Oturum</div>\n              <h2>Bölüm 6: Kızılkent'e Doğru</h2>\n              <p class=\"subtitle\">Kayıtlı Büyücü Arlen, Sahte Cenaze Kumpası, \"Görüş Hattı\" Çıkarımı ve Brevista'ya Varış</p>\n            </div>\n\n            <div class=\"callout\">\n              <div class=\"callout-title\">Karakter Gelişimi: Seviye 4 (Rogue 3 / Fighter 1)</div>\n              <p style=\"margin-bottom:0;\">Bu bölümün başında <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a> <strong>4. seviyeye</strong> yükselir: 3 seviye <em>Rogue (Inquisitive)</em> üzerine 1 seviye <em>Fighter</em> alarak dövüş ve silah hakimiyetini pekiştirir.</p>\n            </div>\n\n            <h2 class=\"section-title\">Bölüm Akışı</h2>\n\n            <h3 class=\"scene-title\" id=\"b6-s1\">Sahne 1: Arlen'in Arkon Mührü, Sektilis Olayları ve Kan İncelemesi</h3>\n            <p>Mezarlık kulübesinde yerde baygın yatan <a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Yanik</a>'in başında, <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a>'in eli tabancasında <a class=\"entity-link\" href=\"#npc-arlen\" data-route=\"npc-arlen\">Arlen</a>'e dönüktür. Arlen yavaşça elini çantasına uzatıp resmi bir parşömen çıkarır.</p>\n\n            <ul>\n              <li><strong>Zar Kontrolü — Investigation (12 + 5 = 17):</strong> <a class=\"entity-link\" href=\"#kural-lingua-imperium\" data-route=\"kural-lingua-imperium\">Lingua Imperium</a> dilinde yazılmış belgede büyük <strong>Arkon Mührü</strong> ve bizzat <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Gezgin Rahip Martin</a>'in imzası bulunmaktadır. Belge tamamen gerçektir: Arlen, büyü kudreti sonradan ortaya çıkmış <strong>kayıtlı bir Sorcerer (Doğuştan Büyücü)</strong> olup ölüm kıyısındaki kişilerin ruhunu bedene çivileme hünerine sahiptir.</li>\n              <li><strong>Sektilis Olayları — Zar Kontrolü: Religion / History (18 + 5 = 23):</strong>\n                <ul>\n                  <li>Alarik, 15 yıl önce Sektilis (Yüksek Güneş / Temmuz-Ağustos) ayında Mavi Koru'nun doğu sınırındaki <strong>Vereli Bayır</strong> bölgesinde patlak veren <a class=\"entity-link\" href=\"#kural-sektilis-olaylari\" data-route=\"kural-sektilis-olaylari\">Sektilis Olayları</a>'nı hatırlar.</li>\n                  <li>Ölen kocasının yerine geçen soylu bir kadının konağında cadılık faaliyetleri tespit edilmiş ve <strong>Mavi Koru 4. Doğu Engizisyon Karakolu</strong>'nun sert müdahalesiyle pek çok cadı kazıkta yakılmıştır. O dönem konakta genç bir hizmetçi olan <a class=\"entity-link\" href=\"#npc-arlen\" data-route=\"npc-arlen\">Arlen</a>, Peder Martin'in şahadeti ve kefaleti sayesinde kazıkta yanmaktan kurtulmuştur.</li>\n                </ul>\n              </li>\n              <li><strong>Kan İncelemesi ve Kritik Keşif:</strong> Alarik su getirme bahanesiyle dışarı çıkıp tabancasına <strong>kutsanmış mermi</strong> sürer. İçeride Arlen, Yanik'in burnundan akan kanı inceler ve çok önemli bir bulguya ulaşır: <strong>Kurbanın kanı sıvılaşmamıştır!</strong> Kan normal kıvamındadır, ancak görünmez ve muazzam bir kuvvet kanı içeriden dışarıya doğru itmiştir!</li>\n              <li><strong>Kiraz Sapı ve Söğüt Özü:</strong> Alarik'in verdiği kan koyulaştırıcı kil hapı ile Arlen'in kanı donduran büyüsü birleşince Yanik'in damarlarının tıkanma riski doğar. <a class=\"entity-link\" href=\"#npc-welford\" data-route=\"npc-welford\">Welford</a> ve <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Haldo</a> gece vakti aktara gidip <strong>kiraz sapı ve söğüt özü</strong> (kan sulandırıcı) alarak kaynatırlar. Alarik, Arlen'i bir daha kendisinden habersiz büyü kullanmaması konusunda sertçe uyarır (<strong>Insight: Başarılı</strong>).</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b6-s2\">Sahne 2: Yanik'in Uyanışı, \"Kambur Joseph\" İpucu ve Sahte Cenaze Planı</h3>\n            <p>Kiraz sapı çayı içirilen <a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Yanik</a> kendine gelir ve saldırı anını anlatır:</p>\n\n            <ul>\n              <li><strong>Saldırı Anı ve \"Kambur Joseph\":</strong> Yanik, <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'da her türlü karanlık sırrı bilen <a class=\"entity-link\" href=\"#npc-kambur-joseph\" data-route=\"npc-kambur-joseph\">Kambur Joseph</a> adında bir muhbirden bahseder. Kasabada üstü kapalı soruşturma yaptıktan sonra mezarlık kapısına geldiğinde <strong>kulağında bir fısıltı</strong> duymuş; önce göğsü kabarıp gözleri dolmuş (duygusal bir coşku/merhamet hissi), hemen ardından göğsüne korkunç bir ağırlık çöküp kalbi geri çekilemeden üst üste atarak kan fışkırtmaya başlamıştır!</li>\n              <li><strong>Alarik'in Sahte Cenaze Planı:</strong> Katilin Yanik'i öldü sanması için Alarik derhal bir kumpas kurar:\n                <ol>\n                  <li>Welford ve Haldo mezarlıkta yeni bir mezar kazıp içine insan ağırlığında eski kıyafet dolu bir çuval gömerler (Welford sabah artan kiraz saplarını <em>\"işe yaramadı, adam öldü\"</em> diyerek aktara iade edecektir).</li>\n                  <li><strong>Ahırda Rol Kesme — Zar Kontrolü: Performance (Avantajlı: 19 + 5 = 24):</strong> Gece saat 01:00'de Alarik (öfkeli ve acımasız Cadı Avcısı rolünde) ve <a class=\"entity-link\" href=\"#npc-arlen\" data-route=\"npc-arlen\">Arlen</a> (Alarik'ten ölesiye korkan, elleri titreyen kadın rolünde) Yanik'in bağlı olduğu ahıra giderler. Ahır katibi <strong>Merlo</strong>'ya Yanik'in öldüğünü ima ederek kapalı faytonuna Engizisyon adına el koyarlar; Yanik'in iki yaşlı atını ahıra <strong>67 altına</strong> (85 altın değer biçilir ancak kasada 67 altın vardır) satıp kendi atlarını kapalı faytona koşarlar.</li>\n                </ol>\n              </li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b6-s3\">Sahne 3: Gece Yarısı Marinette Sermon ve \"Güzel Yüzlü Vaiz\" İpucu</h3>\n            <p>Faytonla mezarlığa döndüklerinde kapı önünde Sermon Ailesi'nin at arabası beklemektedir. <a class=\"entity-link\" href=\"#npc-marinette-sermon\" data-route=\"npc-marinette-sermon\">Marinette Sermon</a>, arabadan hiç inmeden pencere aralığından Alarik ile konuşur (<strong>Insight: 14</strong>).</p>\n\n            <ul>\n              <li><strong>Kritik İpucu — Güzel Yüzlü Vaiz:</strong> Marinette, eski konak arşivlerinde benzer bir ölüm bulamamıştır; ancak çok önemli bir dedikodu getirmiştir: <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'da zengin kadınların salon davetlerinde ve arka sokaklarda vaaz veren, Tapınağa bağlı olmayan, <strong>olağanüstü güzel yüzlü genç bir vaiz</strong> (<a class=\"entity-link\" href=\"#npc-guzel-yuzlu-vaiz\" data-route=\"npc-guzel-yuzlu-vaiz\">Güzel Yüzlü Vaiz</a>) türemiştir! Bu genç vaizin kör çocukların gözlerini açtığı ve çocuğu olmayan kadınlara bereket duası ettiği konuşulmaktadır (tıpkı <a class=\"entity-link\" href=\"#npc-elize-variana\" data-route=\"npc-elize-variana\">Azize Elize Variana</a>'nın mucizeleri gibi!).</li>\n              <li><strong>Tabutta Yolcu:</strong> Alarik, atların satışından gelen 67 altını Yanik'e verir ve kimsenin onu görmemesi için Yanik'i Peder Martin'in eşyalarıyla birlikte <strong>ahşap bir tabutun içine</strong> yatırıp kapalı faytonun arkasına yükler.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b6-s4\">Sahne 4: Gece Yolculuğu ve Alarik'in \"Görüş Hattı (Line of Sight)\" Teorisi</h3>\n            <p>Gece saat 02:00'de önde <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a> ve <a class=\"entity-link\" href=\"#npc-arlen\" data-route=\"npc-arlen\">Arlen</a>, arkada <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Haldo</a> ve tabuttaki <a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Yanik</a> ile Brevista yoluna çıkarlar (<strong>Survival Avantajlı: 13</strong>). Kasabadan uzaklaşınca Yanik tabuttan çıkarılır.</p>\n\n            <div class=\"callout\">\n              <div class=\"callout-title\">Dedektiflik Çıkarımı: Görüş Hattı (Line of Sight)</div>\n              <p style=\"margin-bottom:0;\">Yolda tüm ipuçlarını birleştiren <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a> çok kritik bir sonuca ulaşır: <a class=\"entity-link\" href=\"#npc-marinette-sermon\" data-route=\"npc-marinette-sermon\">Marinette Sermon</a> mezarlık önüne geldiğinde arabadan hiç inmemiş (görünmekten korkmuştur), <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Peder Martin</a> açık meydanda vaaz verirken, <a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Yanik</a> ise mezarlık kapısının önünde açıkta dururken vurulmuştur. Ayrıca Martin, Marinette'in arabasındayken pencereden dışarıdaki birini görünce rahatlamıştır. Demek ki <strong>kan kusturma büyüsünü yapan katilin, kurbanını doğrudan gözüyle görmesi (Line of Sight) gerekmektedir ve katil o sırada bizzat Tepeli Ambar'da bulunmaktaydı!</strong></p>\n            </div>\n\n            <h3 class=\"scene-title\" id=\"b6-s5\">Sahne 5: Buçukluk Rahip Vilgo Külşakak, Kedisi Minnak ve Kızılkent Surları</h3>\n            <p><strong>Zar Kontrolü — Şans Zarı (d20: 10):</strong> Gece yolculuğu sürerken yolda <strong>Taşboğaz</strong>'daki sülükçü akrabalarına giden 107 yaşındaki gezgin buçukluk (halfling) rahip <a class=\"entity-link\" href=\"#npc-vilgo-kulsakak\" data-route=\"npc-vilgo-kulsakak\">Vilgo (Nordan) Külşakak</a> ve kangal köpeği boyundaki vaşak kırması binek kedisi <strong>Minnak</strong> ile karşılaşırlar.</p>\n\n            <ul>\n              <li><strong>Zindalibab Rahibi ve Tütün Takası (Insight: 17 + 7 = 24):</strong> Vilgo; macera, aile ve yol tanrısı olan <a class=\"entity-link\" href=\"#kural-zindalibab\" data-route=\"kural-zindalibab\">Zindalibab</a> (kuyruğunu ısıran/dolanan kedi sembollü tanrı) rahibidir. Alarik'in <em>Insight</em> kontrolüyle tamamen samimi ve gerçek bir din adamı olduğu anlaşılır. Arabaya alınan Vilgo ile Alarik karşılıklı tütün değiş-tokuşu yaparlar.</li>\n              <li><strong>Legendarium Duası ve Bless:</strong> Peder Martin'in ölüm haberine çok üzülen Vilgo, belindeki <em>Legendarium</em> parşömeninden buçukluk dilinde ve <a class=\"entity-link\" href=\"#kural-lingua-imperium\" data-route=\"kural-lingua-imperium\">Lingua Imperium</a> dilinde dua okuyarak ekibi kutsar (<strong>Bless</strong>). Brevista'daki \"güzel yüzlü bağımsız vaizi\" hiç duymadığını, şehirde yalnızca resmi tapınak rahibini bildiğini söyler.</li>\n              <li><strong>Tabutta Uyku ve Kızılkent Surları (Insight: 17):</strong> Taşboğaz sapağında Vilgo ve Minnak iner. <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Haldo</a> ve <a class=\"entity-link\" href=\"#npc-arlen\" data-route=\"npc-arlen\">Arlen</a> öne geçip faytonu sürerken, yorgun düşen Alarik arkadaki boş tabutun içine kıvrılıp uyur (Yanik de yanındaki tabutta sigara içer).</li>\n              <li><strong>Şafak Vakti Brevista (Kızılkent):</strong> Gün doğarken <a class=\"entity-link\" href=\"#loc-kankaya-mevkii\" data-route=\"loc-kankaya-mevkii\">Kankaya</a> bölgesinin kızıl kayalıkları ve dik yamaçları arasındaki <strong>Vulnus Pontem (Yaralı Geçit)</strong> vadisini devasa bir baraj gibi kapatan <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista (Kızılkent)</a> surları ufukta belirir. Surların üzerinde kızıl şehir sancağı ile <strong>Larvos Hanesi</strong>'nin düğün sancakları dalgalanmaktadır.</li>\n            </ul>\n        "
            }

                        },

                              "body": "<strong>AC:</strong> 16 (Studded Leather) • <strong>HP:</strong> 24 (Sv. 3) • <strong>İnisiyatif:</strong> +4 • <strong>Pasif Algı:</strong> 17.<br><strong>Expertise (Uzmanlık):</strong> Insight (+7), Perception (+7), Thieves' Tools (+6).<br><strong>Diğer Beceriler:</strong> Stealth (+6), Investigation (+5), Religion (+5), Survival (+5), Deception (+5), Intimidation (+5), Persuasion (+5), Performance (+5), History (+3), Medicine (+3).<br><strong>Sınıf Özellikleri:</strong> <em>Ear for Deceit</em> (Yalan yakalama Insight zarlarında d20'de 7 ve altı otomatik 8 sayılır; min. 15), <em>Eye for Detail</em>, <em>Insightful Fighting</em>. 6. Bölümde 1 seviye <em>Fighter</em> alarak Seviye 4 olmuştur.<br><strong>Diller ve Aletler:</strong> Emperyan (Common), Okuma-Yazma, <a class=\"entity-link\" href=\"#kural-lingua-imperium\" data-route=\"kural-lingua-imperium\">Lingua Imperium</a>, <a class=\"entity-link\" href=\"#kural-abyssal\" data-route=\"kural-abyssal\">Abyssal / Infernal (Düşmanın Dili)</a>. Thieves' Tools, Poisoner's Kit, İşkence Aletleri (Torture Kit)."

                  "sections": [

                              "body": "Genç yaşta, burnunun üzerinde emaneten duran bir gözlük takan ve <strong>doğuştan sağ gözü şehla (şaşı)</strong> olan bir <a class=\"entity-link\" href=\"#kural-alarath\" data-route=\"kural-alarath\">Alarath</a> vaizidir. İmparatorluk doktrininde fiziksel kusurlar ruhun kusuru sayıldığı için Merkez Eyalet vatandaşı ve güçlü bir hatip olmasına rağmen büyük şapeller yerine <a class=\"entity-link\" href=\"#loc-gumuslu\" data-route=\"loc-gumuslu\">Gümüşlü Kasabası</a>'ndaki <a class=\"entity-link\" href=\"#loc-variana-yetimhanesi\" data-route=\"loc-variana-yetimhanesi\">Azize Variana Yetimhanesi</a>'ne atanmıştır."
                        },
                        {
                              "heading": "Hikâyedeki Rolü ve Sırları",
                              "body": "Yetimlerin bağış parasını yemeyen adil bir yönetici görünümündedir; ancak gizliden gizliye Engizisyon ile irtibatlıdır. 6 yaşındaki <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a> kazan dairesinde 4 zorbayı haşladığında ona <em>'Bazılarımız karanlığa karşı kıvılcım olurken bazılarımız kandil, bazılarımız da sadece ayna olabilir'</em> diyerek <a class=\"entity-link\" href=\"#kural-infazin-yukumlulukleri\" data-route=\"kural-infazin-yukumlulukleri\">İnfazın Yükümlülükleri</a> kitabını vermiş ve birkaç gün sonra gece yarısı çocuğu Engizisyonculara (<a class=\"entity-link\" href=\"#npc-vaden-nikolas\" data-route=\"npc-vaden-nikolas\">Vaden ve Nikolas</a>) teslim etmiştir. 4. Bölümde Alarik'in gördüğü kabusta sağ gözünden siyah zift/kan damlayarak <em>'Unutma, en karanlık ruhların bile af dilenebileceği bir yere ihtiyacı vardır'</em> demiştir."

                              "heading": "Hikâyedeki Rolü ve Sürgünü",

                  "sections": [

                              "heading": "Fiziksel Görünüm ve Hücresi (Insight 24)",
                              "body": "<a class=\"entity-link\" href=\"#loc-kan-degirmeni\" data-route=\"loc-kan-degirmeni\">Kan Değirmeni Karakolu</a>'nun en alt tecrit katındaki demir kapılı 3 Numaralı Hücrede tutulan, 60 yaşlarında, kafası kazınmış, kırçıl sakallı ve göz altları kapkara bir adamdır. Alnının tam ortasında, yara dokusu tutmamış ve tekrar tekrar kesilerek açılmış <strong>üçüncü göz sembolü</strong> vardır. Sesi uzun süre konuşmamaktan puslu ve gırtlaktan çıkar; hücresinin duvarlarına <em>'Affet'</em> ve <em>'Kefaret'</em> kelimeleri kazınmıştır."
                        },
                        {
                              "heading": "Kehanetleri ve Hediyeleri",
                              "body": "• <strong>1. Bölüm:</strong> <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a>'e <a class=\"entity-link\" href=\"#kural-godwin-haten-maniple\" data-route=\"kural-godwin-haten-maniple\">Şehit Rahip Godwin Haten Maniplesi</a>'ni teslim eder, <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Rahip Martin</a> vazifeden dönerse kutsanmış mermiyi ona sıkmasını tembihler ve şu kehaneti verir: <em>'Kandan ağır kızıllık çöktüğünde, seher yolunda bir akbaba çığlık atacak. Günün kabri istikametinde düşen kuşku; çoğu az, hayrı şer, baharı kış edecek.'</em><br>• <strong>5. Bölüm:</strong> İstihare rüyasında Peder Martin'in mezar taşında siyah ziftle <strong>'Amnestia Omnibus'</strong> (<em>Af Herkes İçin</em>) yazdığını gördüğünü anlatır ve Alarik'e kendi üstadından kalma <a class=\"entity-link\" href=\"#kural-yadigar-tesbih\" data-route=\"kural-yadigar-tesbih\">4 İmameli Yadigar Tesbih (Rosary)</a> hediye eder."

            "npc-rahip-martin": {
                  "category": "npc",
                  "typeLabel": "NPC • Gezgin Amarath Rahibi (Merhum)",
                  "title": "Gezgin Rahip Martin",
                  "meta": "İblis Kovucu (Exorcist) ve Şifacı • Durum: Bölüm 1 Sonunda Öldürüldü",
                  "sections": [
                        {
                              "heading": "Fiziksel Görünüm ve Karakteri",
                              "body": "Yaşlı, kır saçlı, yol sakallı, eski cübbeli ve çıplak ayaklı bir <a class=\"entity-link\" href=\"#kural-amarath\" data-route=\"kural-amarath\">Amarath</a> rahibidir. Bedeni güneş yanıkları ve eski ağır yaralarla doludur. Çok güçlü bir şifacı ve usta bir <strong>iblis/ifrit kovucu (exorcist)</strong> olarak tanınır. Görev için çantasında 27 altın taşırken bile kendi botlarını satıp yeni evlenen bir çifte düğün hediyesi yapacak kadar ilkeli, ambar saçakları altında yatan bir din adamıdır."
                        },
                        {
                              "heading": "Geçmiş Bağlantıları",
                              "body": "• 15 yıl önce <a class=\"entity-link\" href=\"#kural-sektilis-olaylari\" data-route=\"kural-sektilis-olaylari\">Sektilis Olayları</a> sırasında hizmetçi kız <a class=\"entity-link\" href=\"#npc-arlen\" data-route=\"npc-arlen\">Arlen</a>'e kefil olarak onu kazıkta yanmaktan kurtarmış ve Arkon Mührü belgesini imzalamıştır.<br>• 10 yıl önce <a class=\"entity-link\" href=\"#loc-tepeli-ambar\" data-route=\"loc-tepeli-ambar\">Tepeli Ambar</a>'da Tiefling <a class=\"entity-link\" href=\"#npc-falkret\" data-route=\"npc-falkret\">Falkret</a> ve yarı-ork <a class=\"entity-link\" href=\"#npc-krasor\" data-route=\"npc-krasor\">Krasor</a>'un kasabalı tarafından kabul edilmesini sağlamıştır.<br>• 5 yıl önce <strong>Kırgeçit</strong> kasabasında <a class=\"entity-link\" href=\"#npc-godfrey\" data-route=\"npc-godfrey\">Godfrey</a> diğer çocukları infaz ederken <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>'i kurtarıp yamağı yapmıştır.<br>• <a class=\"entity-link\" href=\"#npc-kasap-roland\" data-route=\"npc-kasap-roland\">Kasap Roland</a>'ın hasta kızı Tiffany'ye şifalı ilaçlar hazırlamıştır."
                        },
                        {
                              "heading": "Son 24 Saati ve Ölümü",
                              "body": "Elindeki şifreli pusula (<em>'Kemikten kuş yuvasındaki zehirlenen anne kuşu kustur, kusmuğunu sakla'</em>) doğrultusunda <a class=\"entity-link\" href=\"#loc-cygnus-konagi\" data-route=\"loc-cygnus-konagi\">Cygnus Konağı</a>'ndaki ifriti kil testiye hapsetmek üzere <a class=\"entity-link\" href=\"#loc-tepeli-ambar\" data-route=\"loc-tepeli-ambar\">Tepeli Ambar</a>'a gelmiş; <a class=\"entity-link\" href=\"#loc-gumus-gozlu-tuccar\" data-route=\"loc-gumus-gozlu-tuccar\">Gümüş Gözlü Tüccarın Yeri</a>'nden 20 altına ritüel malzemeleri almış, <a class=\"entity-link\" href=\"#loc-canavar-magarasi\" data-route=\"loc-canavar-magarasi\">Canavar Mağarası</a>'nda 50 dakika birini beklemiş, akşam <a class=\"entity-link\" href=\"#npc-marinette-sermon\" data-route=\"npc-marinette-sermon\">Marinette Sermon</a>'un arabasında konuşurken dışarıda gördüğü bir tanıdığa gülümseyerek rahatlamış; ertesi sabah <a class=\"entity-link\" href=\"#loc-vaaz-meydani\" data-route=\"loc-vaaz-meydani\">Vaaz Meydanı</a>'nda konuşurken kalbinin aşırı basınçla çarpıp tüm deliklerinden kanının boşaltılmasıyla öldürülmüştür."
                        }

            "npc-falkret": {
                  "category": "npc",
                  "typeLabel": "NPC • Tiefling Hancı",
                  "title": "Falkret",
                  "meta": "Canavar Mağarası Tavernası Sahibi • Rahip Martin'in Eski Dostu",
                  "sections": [
                        {
                              "heading": "Fiziksel Görünüm ve Kişilik",
                              "body": "Kırmızı tenli, arkaya uzanan iki boynuzundan biri kırık ve özenle törpülenmiş, siyah göz aklı, kırmızı irisli bir Tieflingdir. Görünümünün aksine tam bir İmparatorluk beyefendisi gibi şık yelek ve köstekli saat takar; derin, yanık bir sesi vardır ve başkentte bulunmuş kültürlü bir adamdır. Devasa yarı-ork <a class=\"entity-link\" href=\"#npc-krasor\" data-route=\"npc-krasor\">Krasor</a> onun manevi kardeşidir."
                        },
                        {
                              "heading": "Hikâyedeki Rolü",
                              "body": "10 yıl önce <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Rahip Martin</a>'in yardımıyla <a class=\"entity-link\" href=\"#loc-tepeli-ambar\" data-route=\"loc-tepeli-ambar\">Tepeli Ambar</a>'da tutunabilmiş ve mahalledeki yoksullara yemek dağıtan biri olmuştur. <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a>'e Martin'in dün tavernada sırtını duvara vererek 50 dakika gergin biçimde birini beklediğini ve çıkmadan önce kör sokaktaki kapalı kuyuya baktığını anlatır. Ayrıca 'Aşiyan (Kuş Yuvası)' şifresinin <a class=\"entity-link\" href=\"#loc-kemikli-koru\" data-route=\"loc-kemikli-koru\">Kemikli Koru</a> yakınlarındaki <a class=\"entity-link\" href=\"#loc-cygnus-konagi\" data-route=\"loc-cygnus-konagi\">Cygnus Konağı</a> olduğunu çözerek soruşturmanın kilidini açar."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-2",
                              "label": "Bölüm 2: Sahne 5"
                        },
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 4 (Yanik'in Doğrulaması)"
                        }
                  ]
            },
            "npc-krasor": {
                  "category": "npc",
                  "typeLabel": "NPC • Yarı-Ork Kapı Görevlisi",
                  "title": "Krasor",
                  "meta": "Canavar Mağarası Tavernası • Falkret'in Kardeşi",
                  "sections": [
                        {
                              "heading": "Görünüm ve Rolü",
                              "body": "<a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Haldo</a>'dan bile daha iri, dağ gibi yapılı, yüzünde yara izi bulunan ancak saçları nizami kesilmiş ve temiz giyimli bir yarı-orktur. <a class=\"entity-link\" href=\"#loc-canavar-magarasi\" data-route=\"loc-canavar-magarasi\">Canavar Mağarası Tavernası</a>'nın kapısında güvenliği sağlar."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-2",
                              "label": "Bölüm 2: Sahne 5"
                        }
                  ]
            },
            "npc-velmut": {
                  "category": "npc",
                  "typeLabel": "NPC • Paralı Asker Komutanı",
                  "title": "Yüzbaşı Velmut",
                  "meta": "Tepeli Ambar Garnizon Komutanı • Lord Ferdinand Larvos'un Subayı",
                  "sections": [
                        {
                              "heading": "Fiziksel Görünüm ve Yetkisi",
                              "body": "40'larının sonunda, bir ayağı belirgin şekilde topal olan ve keçi başlı bastona dayanarak yürüyen tecrübeli bir subaydır. Askerleri mavi-beyaz üniforma ve <strong>altın boynuzlu keçi ile altın kabzalı kılıç</strong> arması taşır. <strong>Lord Ferdinand Larvos</strong>'un kanunu uyarınca kasabaya giren tüm kervan muhafızlarını denetleme ve göreve çağırma yetkisine sahiptir."
                        },
                        {
                              "heading": "Hikâyedeki Rolü",
                              "body": "2. Bölümde gece devriyesinde <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>'e tam işbirliği sunar; <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'ya ulak gönderdiğini bildirir, Alarik'in isteği üzerine kervan muhafızlarını mezarlığa gönderip ekibe tenteli bir at arabası tahsis eder."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-2",
                              "label": "Bölüm 2: Sahne 6"
                        }
                  ]
            },
            "npc-richmund-sermon": {
                  "category": "npc",
                  "typeLabel": "NPC • Kasaba Muhtarı ve Tüccar",
                  "title": "Richmund Sermon",
                  "meta": "Tepeli Ambar Muhtarı • Ölüm Döşeğinde",
                  "sections": [
                        {
                              "heading": "Durumu ve Ailesi",
                              "body": "<a class=\"entity-link\" href=\"#loc-tepeli-ambar\" data-route=\"loc-tepeli-ambar\">Tepeli Ambar</a>'daki en büyük ambarların sahibi olan yaşlı ve zengin muhtardır. Ağır bir hastalık nedeniyle <a class=\"entity-link\" href=\"#loc-sermon-konagi\" data-route=\"loc-sermon-konagi\">Sermon Konağı</a>'nda ölüm döşeğindedir. Genç eşi <a class=\"entity-link\" href=\"#npc-marinette-sermon\" data-route=\"npc-marinette-sermon\">Marinette Sermon</a> ve en büyük kızının kocası olan damadı <a class=\"entity-link\" href=\"#npc-otto-adren\" data-route=\"npc-otto-adren\">Otto Adren</a> konakta yaşamaktadır."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-2",
                              "label": "Bölüm 2: Sahne 3 ve 6"
                        },
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 4"
                        }
                  ]
            },
            "npc-marinette-sermon": {
                  "category": "npc",
                  "typeLabel": "NPC • Soylu Kadın / Tanık",
                  "title": "Marinette Sermon (Marlov)",
                  "meta": "Muhtar Richmund Sermon'un Genç Eşi • Sermon Konağı",
                  "sections": [
                        {
                              "heading": "Fiziksel Görünüm ve Kişilik",
                              "body": "20'li yaşlarının başında, yüzü çilli (<a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a>'e çocukluk arkadaşı <a class=\"entity-link\" href=\"#npc-annie\" data-route=\"npc-annie\">Annie</a>'yi hatırlatır), varlıklı çiftlik ailesi <strong>Marlov</strong> soyundan gelen genç kadındır. Yaşlı kocası <a class=\"entity-link\" href=\"#npc-richmund-sermon\" data-route=\"npc-richmund-sermon\">Richmund Sermon</a> ölüm döşeğindedir; üvey kızının kocası <a class=\"entity-link\" href=\"#npc-otto-adren\" data-route=\"npc-otto-adren\">Otto Adren</a>'den nefret eder."
                        },
                        {
                              "heading": "Bölümlerdeki Rolü ve Verdiği Kritik İpuçları",
                              "body": "• <strong>2. Bölüm:</strong> Gece yarısı at arabasıyla mezarlığa gelir. Alarik'in sorgusunda (Intimidation 21), kendisine kötülüğü dokunmuş yaşlı kocasını zehirleyip öldürme günahını işlemek üzereyken dün gece arabada <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Rahip Martin</a>'e danıştığını ve vazgeçtiğini itiraf eder. Konuşurlarken Martin'in arabanın camından dışarıya <strong>biri ona seslenmiş gibi</strong> bakıp gülümsediğini ve rahatladığını söyler.<br>• <strong>5. Bölüm:</strong> <a class=\"entity-link\" href=\"#loc-sermon-konagi\" data-route=\"loc-sermon-konagi\">Sermon Konağı</a>'nda Alarik'i ağırlar ve eski ölüm kayıtlarını araştırmayı kabul eder.<br>• <strong>6. Bölüm:</strong> Gece yarısı mezarlık önüne gelir ancak <strong>arabadan hiç inmeden</strong> içeriden konuşur (bu davranış Alarik'in <em>Görüş Hattı</em> teorisini çözmesini sağlar). <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'da zengin kadınların davetlerinde vaaz veren ve kör çocukların gözlerini açtığı söylenen <a class=\"entity-link\" href=\"#npc-guzel-yuzlu-vaiz\" data-route=\"npc-guzel-yuzlu-vaiz\">Güzel Yüzlü Vaiz</a> dedikodusunu Alarik'e iletir."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-2",
                              "label": "Bölüm 2: Sahne 6 (Gece İtirafı)"
                        },
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 4 (Sermon Konağı)"
                        },
                        {
                              "chapterId": "bolum-6",
                              "label": "Bölüm 6: Sahne 3 (Güzel Yüzlü Vaiz İpucu)"
                        }
                  ]
            },
            "npc-pietro": {
                  "category": "npc",
                  "typeLabel": "NPC • Sadık Kahya (Merhum)",
                  "title": "Kahya Pietro",
                  "meta": "Cygnus Konağı Kahyası • Durum: Bölüm 3'te Ritüelde Öldü",
                  "sections": [
                        {
                              "heading": "Görünüm ve Trajik Sadakati",
                              "body": "Yaşlı, aksak yürüyen ve ömrünü <a class=\"entity-link\" href=\"#loc-cygnus-konagi\" data-route=\"loc-cygnus-konagi\">Cygnus Hanesi</a>'ne adamış sadık kahyadır. Eski Lord ve Lady av kazasında öldükten sonra ikizler <strong>Gabriel</strong> ve <a class=\"entity-link\" href=\"#npc-gabriana-cygnus\" data-route=\"npc-gabriana-cygnus\">Gabriana</a>'yı büyütmüş; Gabriel'in intiharı ve Gabriana'nın 3 yıllık eriyişi karşısında çaresizce durumu gizlemiştir. 3. Bölümde <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>'in önerisiyle leydisini kurtarmak için <a class=\"entity-link\" href=\"#kural-aktarimsal-arindirim\" data-route=\"kural-aktarimsal-arindirim\">Aktarımsal Arındırım</a> ritüelinde <strong>canlı yem (geçici konak)</strong> olmayı gönüllü olarak kabul etmiş ve iblisin saldırısıyla kalbi durarak can vermiştir."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-3",
                              "label": "Bölüm 3: Sahne 2–4"
                        }
                  ]
            },
            "npc-gabriana-cygnus": {
                  "category": "npc",
                  "typeLabel": "NPC • Soylu Leydi (Merhum)",
                  "title": "Lady Gabriana Cygnus",
                  "meta": "Cygnus Hanesi'nin Son Varisi • \"Zehirlenen Anne Kuş\" • Durum: Bölüm 3'te Öldü",
                  "sections": [
                        {
                              "heading": "Durumu ve Akıbeti",
                              "body": "<a class=\"entity-link\" href=\"#loc-cygnus-konagi\" data-route=\"loc-cygnus-konagi\">Cygnus Konağı</a>'nın son varisi ve intihar eden <strong>Gabriel Cygnus</strong>'un ikiz kardeşidir. Bahçedeki yarık huş ağacından sızan <a class=\"entity-link\" href=\"#npc-cygnus-ifriti\" data-route=\"npc-cygnus-ifriti\">Cygnus İfriti</a> tarafından 3 yıldır ele geçirilmiş halde odasında bir deri bir kemik erimiştir. Şifreli pusuladaki <em>'Kemikten kuş yuvasındaki zehirlenen anne kuş'</em> kendisidir. 3. Bölümdeki <a class=\"entity-link\" href=\"#kural-aktarimsal-arindirim\" data-route=\"kural-aktarimsal-arindirim\">Aktarımsal Arındırım</a> ritüeliyle içindeki ifritten kurtarılmış, ancak <code>d20: 2</code> hayatta kalma zarıyla aşırı kan kaybı ve bitkinlikten kurtulamayarak vefat etmiştir."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-2",
                              "label": "Bölüm 2: Sahne 5–6 (Bahsi Geçer)"
                        },
                        {
                              "chapterId": "bolum-3",
                              "label": "Bölüm 3: Sahne 2–4"
                        }
                  ]
            },
            "npc-cygnus-ifriti": {
                  "category": "npc",
                  "typeLabel": "Doğaüstü Varlık • İblis / İfrit",
                  "title": "Cygnus İfriti (Testideki Varlık)",
                  "meta": "Habis Varlık • Durum: Mühürlü Kil Testide Hapis",
                  "sections": [
                        {
                              "heading": "Doğası ve Mühürlenişi",
                              "body": "<a class=\"entity-link\" href=\"#loc-cygnus-konagi\" data-route=\"loc-cygnus-konagi\">Cygnus Konağı</a> bahçesindeki yıldırım yarığı bulunan beyaz huş ağacından sızarak <a class=\"entity-link\" href=\"#npc-gabriana-cygnus\" data-route=\"npc-gabriana-cygnus\">Lady Gabriana Cygnus</a>'un bedenine kök salmış habis varlıktır. <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a> onunla <a class=\"entity-link\" href=\"#kural-abyssal\" data-route=\"kural-abyssal\">Abyssal</a> dilinde konuştuğunda kibirle <em>'Hiçbir şey yapamazsınız, yıllardır buradayım!'</em> diye yanıt vermiştir. 3. Bölümde <a class=\"entity-link\" href=\"#npc-pietro\" data-route=\"npc-pietro\">Pietro</a> ve <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>'in hayatı pahasına kil testinin içine çekilmiş ve <a class=\"entity-link\" href=\"#kural-godwin-haten-maniple\" data-route=\"kural-godwin-haten-maniple\">Godwin Haten Maniplesi</a> ile mühürlenmiştir. 4. Bölüm boyunca üç farklı güç odağı bu testiyi ele geçirmeye çalışmıştır."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-3",
                              "label": "Bölüm 3: Sahne 2–4"
                        },
                        {
                              "chapterId": "bolum-4",
                              "label": "Bölüm 4: Sahne 1–4 (Testinin Peşindekiler)"
                        },
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 1 (Demirbaş Kasasında)"
                        }
                  ]
            },
            "npc-vernon-carlin": {
                  "category": "npc",
                  "typeLabel": "NPC • Amarath Şövalyesi",
                  "title": "Sör Vernon Carlin",
                  "meta": "Gayri Müsellah Azizler Tarikatı • Yaveri: Jorel",
                  "sections": [
                        {
                              "heading": "Fiziksel Görünüm ve İlkeleri",
                              "body": "Devasa yapılı, blok göğüs zırhı üzerinde <strong>üç kılıç ayaklı kazan</strong> sembolü ve <em>'Hic est sanctuarium meum'</em> (Mabedim burası) yazısı taşıyan bir şövalyedir. <a class=\"entity-link\" href=\"#kural-gayri-musellah-azizler\" data-route=\"kural-gayri-musellah-azizler\">Gayri Müsellah Azizler</a> tarikatına mensup olduğu için savaş meydanı dışında üzerinde silah taşımaz; silahlarını genç yaveri <a class=\"entity-link\" href=\"#npc-jorel\" data-route=\"npc-jorel\">Jorel</a> taşır."
                        },
                        {
                              "heading": "Gece Kampı Karşılaşması (Bölüm 4)",
                              "body": "Gece saat 02:00'de <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a>'in kampına gelerek <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'daki düğüne giderken <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Rahip Martin</a>'in düştüğünü duyduğunu ve mühürlü testiyi teslim almaya geldiğini söyler. Alarik prosedür gereği reddedip onu <a class=\"entity-link\" href=\"#loc-kan-degirmeni\" data-route=\"loc-kan-degirmeni\">Kan Değirmeni Karakolu</a>'na yönlendirince zor kullanmaz ve <em>'Merhamet yüreğe ağırlık verir, kaldıramayan yürekler için özellikle'</em> diyerek saygıyla ayrılır."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-4",
                              "label": "Bölüm 4: Sahne 2"
                        }
                  ]
            },
            "npc-jorel": {
                  "category": "npc",
                  "typeLabel": "NPC • Şövalye Yaveri",
                  "title": "Jorel",
                  "meta": "Sör Vernon Carlin'in Genç Yaveri",
                  "sections": [
                        {
                              "heading": "Rolü",
                              "body": "<a class=\"entity-link\" href=\"#npc-vernon-carlin\" data-route=\"npc-vernon-carlin\">Sör Vernon Carlin</a>'in silahlarını taşıyan genç yaverdir. 4. Bölümde gece kampına yaklaştıklarında at üzerinde uyuklarken <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a> arkadan gizlice dolanıp şakağına tabanca dayamıştır."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-4",
                              "label": "Bölüm 4: Sahne 2"
                        }
                  ]
            },
            "npc-ulak-konrad": {
                  "category": "npc",
                  "typeLabel": "NPC • Gizli Ajan / Ulak",
                  "title": "Ulak Konrad",
                  "meta": "\"Beyaz Şehir'deki Çok Yaşlı Birileri\"nin Temsilcisi",
                  "sections": [
                        {
                              "heading": "Görünüm ve Beden Dili Değişimi (Stealth 23)",
                              "body": "Yüzünde akılda kalacak hiçbir ayırt edici özellik bulunmayan, bıyıklı ve son derece kibar konuşan bir adamdır. 4. Bölümde gece <a class=\"entity-link\" href=\"#loc-tepeli-ambar-mezarligi\" data-route=\"loc-tepeli-ambar-mezarligi\">Tepeli Ambar Mezarlığı</a> kulübesine gelerek <strong>'Beyaz Şehir'deki (Sanctuary) çok yaşlı birileri'</strong> adına <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'daki Larvos düğününe giderken uğradığını ve Alarik'teki <em>'koyu renkli, kokan bayat şarap testisini'</em> almaya geldiğini söyler. Reddedilip mezarlık kapısından çıktığı anda <strong>yürüyüşü, adım sıklığı ve omuz açısı tamamen değişir</strong>. Geceyi <a class=\"entity-link\" href=\"#loc-altin-nota\" data-route=\"loc-altin-nota\">Altın Nota Tavernası</a>'nda geçirmiştir."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-4",
                              "label": "Bölüm 4: Sahne 3"
                        }
                  ]
            },
            "npc-leroy": {
                  "category": "npc",
                  "typeLabel": "NPC • Zengin Hancı",
                  "title": "Hancı Leroy",
                  "meta": "Altın Nota Tavernası Sahibi • Tepeli Ambar",
                  "sections": [
                        {
                              "heading": "Görünüm ve Tutumu",
                              "body": "<a class=\"entity-link\" href=\"#loc-tepeli-ambar\" data-route=\"loc-tepeli-ambar\">Tepeli Ambar</a>'ın en lüks hanı olan <a class=\"entity-link\" href=\"#loc-altin-nota\" data-route=\"loc-altin-nota\">Altın Nota Tavernası</a>'nın sahibidir. <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>'e büyük hürmet gösterir, <a class=\"entity-link\" href=\"#npc-ulak-konrad\" data-route=\"npc-ulak-konrad\">Ulak Konrad</a> ve Brevista'daki Larvos düğünü hakkında bilgi verir ve Alarik'e bedava yol azığı (otlu kokulu peynir, yemişli pastırma) ile işlemeli şişede <strong>'Gece' şarabı</strong> hediye eder."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-4",
                              "label": "Bölüm 4: Sahne 3"
                        }
                  ]
            },
            "npc-alvin-bereketsoy": {
                  "category": "npc",
                  "typeLabel": "NPC • Tapınak Şövalyesi",
                  "title": "Sör Alvin Bereketsoy",
                  "meta": "Yüksek Piskopos Caligus'un Muhafız Şövalyesi",
                  "sections": [
                        {
                              "heading": "Soyadı ve Rolü (History 22)",
                              "body": "Soylu doğmayıp sonradan liyakatle şövalye ilan edilen Amarath şövalyelerine verilen <em>Bereketsoy</em> soyadını taşır. Beyaz atlı ve tam plaka zırhlıdır. 4. Bölümde karakola 1,5 saat kala <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a>'in yolunu kesip <a class=\"entity-link\" href=\"#npc-piskopos-caligus\" data-route=\"npc-piskopos-caligus\">Yüksek Piskopos Caligus</a> imzalı emirle testiyi ister; ancak Alarik <em>'Heyhat! Okumam yok!'</em> oyunuyla onu savuşturur. Ardından Piskopos'un karakol baskınında yer alır."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-4",
                              "label": "Bölüm 4: Sahne 4"
                        }
                  ]
            },
            "npc-piskopos-caligus": {
                  "category": "npc",
                  "typeLabel": "NPC • Yüksek Din Adamı",
                  "title": "Yüksek Piskopos Manus Landebert Adrein Caligus",
                  "meta": "Lejyon Kökenli Soylu Piskopos • Bizzat Karakolu Bastı",
                  "sections": [
                        {
                              "heading": "Kökeni ve İsimlerinin Anlamı (History 21, Religion 19)",
                              "body": "Lejyon kökenli güçlü <strong>Caligus</strong> ailesine mensuptur. İsimlerini iki büyük din büyüğünden almıştır: Ailesini katleden şövalyeyi affeden aziz <em>Landebert</em> ve Başrahip Hefter döneminde kendini siper eden Sunak Şehitlerinden <em>Adrein</em>."
                        },
                        {
                              "heading": "Karakol Baskını ve Brevista Düğünü",
                              "body": "4. Bölümde altın-gümüş işlemeli iki araba, <a class=\"entity-link\" href=\"#npc-alvin-bereketsoy\" data-route=\"npc-alvin-bereketsoy\">Sör Alvin Bereketsoy</a> ve 8 tam zırhlı şövalyeyle bizzat <a class=\"entity-link\" href=\"#loc-kan-degirmeni\" data-route=\"loc-kan-degirmeni\">Kan Değirmeni Karakolu</a>'na gelerek mühürlü testiyi talep eder. <a class=\"entity-link\" href=\"#npc-godfrey\" data-route=\"npc-godfrey\">Pınaryurtlu Godfrey</a> 20 dakikalık baş başa görüşmede testiyi vermeyi reddedince büyük bir öfkeyle ayrılır ve birkaç gün içinde Godfrey'i kuzeye sürgün ettirir. 5. Bölümde <a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Yanik</a>'in istihbaratıyla, Piskopos'un <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'daki <strong>Larvos Hanesi düğününe</strong> katılıp şehri kutsadığı öğrenilir."
                        }
                  ],

                              "chapterId": "bolum-5",

                        }
                  ]
            },
            "npc-jaret-von-dafflin": {
                  "category": "npc",
                  "typeLabel": "NPC • Avcı Kaptan",
                  "title": "Avcı Kaptan Jaret von Dafflin",
                  "meta": "Kan Değirmeni Karakolu Yeni Vekil Kumandanı • Batı Kalkanı Soylusu",
                  "sections": [
                        {
                              "heading": "Görünüm, Uzmanlık ve 6 Günlük Demirbaş Planı",
                              "body": "Batı Kalkanı soylusu olan, sorgu ve işkence uzmanı bir Avcı Kaptandır. <a class=\"entity-link\" href=\"#npc-godfrey\" data-route=\"npc-godfrey\">Pınaryurtlu Godfrey</a> kuzeye sürgün edilince <a class=\"entity-link\" href=\"#loc-kan-degirmeni\" data-route=\"loc-kan-degirmeni\">Kan Değirmeni Karakolu</a>'nun vekil komutanlığını devralır. 5. Bölümde Godfrey ve <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a> ile birlikte <strong>6 Günlük Demirbaş Sayımı</strong> planını devreye sokarak gerçek testiyi kasasında saklar ve Alarik'e zaman kazandırır."
                        }
                  ],

                              "label": "Bölüm 4: Sahne 4"
                        },

                              "chapterId": "bolum-5",

                        }
                  ]
            },
            "npc-tufekci-rorik": {
                  "category": "npc",
                  "typeLabel": "NPC • Engizisyon Cephanelik Uzmanı",
                  "title": "Tüfekçi Rorik",
                  "meta": "Kan Değirmeni Karakolu • Barut ve Ateşli Silah Uzmanı",
                  "sections": [
                        {
                              "heading": "Görünüm ve Verdiği Ekipmanlar",
                              "body": "Kafası tamamen kazınmış, gözlüklü, bembeyaz tenli ve patlamalara takıntılı bir avcıdır. 5. Bölümde <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>'e <strong>iki katmanlı monoküler dürbün</strong>, <strong>2 adet fitilli el bombası</strong> ve metal bir puro tüpü içinde <strong>3 adet kutsanmış mermi</strong> teslim eder."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 2"
                        }
                  ]
            },
            "npc-simyaci-konrad": {
                  "category": "npc",
                  "typeLabel": "NPC • Engizisyon Simyacısı",
                  "title": "Kardeş Konrad (Simyacı)",
                  "meta": "Kan Değirmeni Karakolu • Zehir ve İksir Uzmanı",
                  "sections": [
                        {
                              "heading": "Görünüm ve Verdiği İksirler",
                              "body": "Genel görünümü sağlıklı olsa da kimyasallarla uğraşmaktan dişleri ve tırnakları sapsarı olmuş simyacı avcıdır. 5. Bölümde <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>'e üç önemli karışım verir: <strong>Hakikat Serumu</strong>, <strong>Kan Koyulaştırıcı Panzehir (Kil Hapı)</strong> ve <strong>Tatsız/Kokusuz Ölüm Zehri</strong> (4 saat sonra cesette iz bırakmayan siyah/şeffaf sıvı)."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 2"
                        }
                  ]
            },
            "npc-yasli-cerci": {
                  "category": "npc",
                  "typeLabel": "NPC • Gezgin Satıcı",
                  "title": "Yaşlı Çerçi",
                  "meta": "Kankaya Yolu • Eşekli ve Gürzlü Seyyar Tüccar",
                  "sections": [
                        {
                              "heading": "Karşılaşma ve Hediyesi",
                              "body": "5. Bölümde gece kampına eşeğiyle gelen, belinde açıkça gürz taşıyan tecrübeli bir yol satıcısıdır. <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a> ondan 5 altına ispirto, çavdar, yağlı Mavi Koru tütünü ve erzak alır. Alarik görevde olduğu için çerçinin votka ikramını reddedince, çerçi yol adeti gereği ona bedavaya bir <strong>Piton Kiti (tırmanma kancaları)</strong> hediye eder."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 3"
                        }
                  ]
            },
            "npc-kasap-roland": {
                  "category": "npc",
                  "typeLabel": "NPC • Engizisyon İrtibatı / Eski Lejyoner",
                  "title": "Kasap Roland ve Kızı Tiffany",
                  "meta": "Tepeli Ambar Kasabı • Aşırı Dindar Emekli Lejyoner",
                  "sections": [
                        {
                              "heading": "Görünüm ve Hikâyedeki Rolü",
                              "body": "40'lı yaşlarında, aşırı dindarlığı yüzünden Lejyon'dan erken emekli edilmiş eski bir asker ve <a class=\"entity-link\" href=\"#loc-kan-degirmeni\" data-route=\"loc-kan-degirmeni\">Kan Değirmeni Karakolu</a>'nun <a class=\"entity-link\" href=\"#loc-tepeli-ambar\" data-route=\"loc-tepeli-ambar\">Tepeli Ambar</a>'daki iki gizli irtibatından biridir. 10 yaşındaki hasta kızı <strong>Tiffany</strong> dükkanda kendi boyu kadar bıçakları biler. <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Rahip Martin</a> geçmişte Tiffany'ye şifalı ilaçlar yapmıştır. Roland, Alarik için kasaba esnafını ve yabancıları gözetlemeyi üstlenir."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 1 ve 3"
                        }
                  ]
            },
            "npc-yanik": {
                  "category": "npc",
                  "typeLabel": "NPC • Engizisyon Muhbiri / Faytoncu",
                  "title": "Faytoncu Yanik (\"Şerefsiz Yanik\")",
                  "meta": "10 Yıllık Engizisyon Muhbiri • Kan Kusturma Saldırısından Sağ Kurtulan Tek Kişi",
                  "sections": [
                        {
                              "heading": "Fiziksel Görünüm ve Karakteri",
                              "body": "Sivri yüzlü, kemerli burunlu, ağzı bozuk (özellikle Terzi Willy'ye söven) ama 10 yıldır <a class=\"entity-link\" href=\"#loc-kan-degirmeni\" data-route=\"loc-kan-degirmeni\">Kan Değirmeni Karakolu</a>'na sadakatle çalışan kurnaz bir faytoncu ve muhbirdir."
                        },
                        {
                              "heading": "Kanlı Saldırı ve Sahte Cenaze (Bölüm 5–6)",
                              "body": "• <strong>5. Bölüm:</strong> <a class=\"entity-link\" href=\"#npc-piskopos-caligus\" data-route=\"npc-piskopos-caligus\">Yüksek Piskopos Caligus</a>'un <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'daki Larvos düğününü kutsadığını bildirir. Alarik'in emriyle kasabada soruşturma yaparken akşam vakti <a class=\"entity-link\" href=\"#loc-tepeli-ambar-mezarligi\" data-route=\"loc-tepeli-ambar-mezarligi\">Tepeli Ambar Mezarlığı</a> kapısında tıpkı <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Rahip Martin</a> gibi kan kusarak yere yığılır! Alarik'in ağzına tıktığı <strong>kan koyulaştırıcı kil hapı</strong> ve <a class=\"entity-link\" href=\"#npc-arlen\" data-route=\"npc-arlen\">Arlen</a>'in kanı donduran büyüsü sayesinde ölümden döner.<br>• <strong>6. Bölüm:</strong> Kiraz sapı çayıyla uyandığında saldırı anını anlatır: Kulağında bir fısıltı duymuş, önce göğsü kabarıp gözleri dolmuş, ardından kalbi aşırı basınçla üst üste çarparak kan fışkırtmıştır. Katilin onu öldü sanması için mezarlığa sahte mezar kazılır, ahırdaki iki yaşlı atı 67 altına satılır ve Yanik bir <strong>tabutun içinde</strong> gizlice faytonla Brevista'ya götürülür. Brevista'daki muhbir <a class=\"entity-link\" href=\"#npc-kambur-joseph\" data-route=\"npc-kambur-joseph\">Kambur Joseph</a> ismini Alarik'e o verir."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 1, 4 ve 5 (Saldırı)"
                        },
                        {
                              "chapterId": "bolum-6",
                              "label": "Bölüm 6: Sahne 1–5 (Kurtuluşu ve Tabutta Yolculuk)"
                        }
                  ]
            },
            "npc-otto-adren": {
                  "category": "npc",
                  "typeLabel": "NPC • Şüpheli Soylu Damat",
                  "title": "Otto Adren",
                  "meta": "Muhtar Richmund Sermon'un Damadı • Sermon Konağı",
                  "sections": [
                        {
                              "heading": "Şüpheli Davranışları",
                              "body": "Ölüm döşeğindeki <a class=\"entity-link\" href=\"#npc-richmund-sermon\" data-route=\"npc-richmund-sermon\">Richmund Sermon</a>'un en büyük kızının kocasıdır; genç üvey anne <a class=\"entity-link\" href=\"#npc-marinette-sermon\" data-route=\"npc-marinette-sermon\">Marinette Sermon</a> ondan nefret etmektedir. 5. Bölümde <a class=\"entity-link\" href=\"#npc-welford\" data-route=\"npc-welford\">Mezarcı Welford</a>, Otto Adren'in yüzü asık bir şekilde mezarlığa gelerek <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>'in ölümünü ve nereye gömüldüğünü sorduğunu bildirir."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 3 ve 4"
                        }
                  ]
            },
            "npc-arlen": {
                  "category": "npc",
                  "typeLabel": "NPC • Kayıtlı Büyücü (Sorcerer) ve Kumaş Tüccarı",
                  "title": "Arlen",
                  "meta": "Arkon Mührü Sahibi Sorcerer • Sektilis Olayları Kurtulanı",
                  "sections": [
                        {
                              "heading": "Fiziksel Görünüm",
                              "body": "Uzun siyah saçlı, kırık beyaz seyahat kıyafetleri giyen, gümüş mücevherler taşıyan ve <strong>sol gözünün kenarında derin bir kesik izi</strong> bulunan eğitimli bir kadındır."
                        },
                        {
                              "heading": "Geçmişi ve Büyü Hüneri (Investigation 17, History 23)",
                              "body": "15 yıl önce Mavi Koru sınırındaki Vereli Bayır'da gerçekleşen <a class=\"entity-link\" href=\"#kural-sektilis-olaylari\" data-route=\"kural-sektilis-olaylari\">Sektilis Olayları</a> sırasında cadılık yapılan konakta genç bir hizmetçiyken, <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Gezgin Rahip Martin</a>'in kefaletiyle kazıkta yakılmaktan kurtulmuştur. Büyü kudreti sonradan ortaya çıkmış <strong>kayıtlı bir Sorcerer</strong> olup üzerinde bizzat Rahip Martin imzalı ve <strong>Arkon Mührü</strong> taşıyan resmi izin belgesi vardır. Ölüm kıyısındaki kişilerin ruhunu ve kanını bedene çivileme/dondurma büyüsüne sahiptir."
                        },
                        {
                              "heading": "Hikâyedeki Rolü",
                              "body": "5. Bölüm sonunda <a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Yanik</a> kan kusarak mezarlık kapısına yığıldığında büyüsüyle Yanik'in kanını damarlarında dondurarak hayatını kurtarır. 6. Bölümde Yanik'in kanının sıvılaşmadığını, aksine görünmez bir kuvvetle içeriden dışarıya itildiğini tespit eder; ahırda <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a>'ten ölesiye korkan kadın rolü oynayarak (Performance 24) faytonu ele geçirmelerine yardım eder ve ekiple birlikte <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'ya yolculuk eder."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-5",
                              "label": "Bölüm 5: Sahne 5"
                        },
                        {
                              "chapterId": "bolum-6",
                              "label": "Bölüm 6: Sahne 1–5"
                        }
                  ]
            },
            "npc-kambur-joseph": {
                  "category": "npc",
                  "typeLabel": "NPC • Brevista Muhbiri (Bahsi Geçen)",
                  "title": "Kambur Joseph",
                  "meta": "Brevista (Kızılkent) Yeraltı Muhbiri",
                  "sections": [
                        {
                              "heading": "Bilinen Bilgiler",
                              "body": "6. Bölümde <a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Faytoncu Yanik</a>'in <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>'e önerdiği isimdir. <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista (Kızılkent)</a> şehrinde kimin girip çıktığını ve her türlü gizli dedikoduyu bilen önemli bir yeraltı muhbiridir."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-6",
                              "label": "Bölüm 6: Sahne 2"
                        }
                  ]
            },
            "npc-guzel-yuzlu-vaiz": {
                  "category": "npc",
                  "typeLabel": "NPC • Baş Şüpheli / Gizemli Vaiz",
                  "title": "Güzel Yüzlü Genç Vaiz",
                  "meta": "Brevista'da Türeyen Bağımsız Vaiz • Mucize İddiaları",
                  "sections": [
                        {
                              "heading": "Hakkındaki İpuçları ve Şüpheler",
                              "body": "6. Bölümde <a class=\"entity-link\" href=\"#npc-marinette-sermon\" data-route=\"npc-marinette-sermon\">Marinette Sermon</a>'un verdiği kritik istihbarata göre, yakın zamanda <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista (Kızılkent)</a> şehrinde zengin kadınların salon davetlerinde ve arka sokaklarda vaaz veren, resmi Tapınağa bağlı olmayan, <strong>olağanüstü güzel yüzlü genç bir vaiz</strong> ortaya çıkmıştır. Bu vaizin kör çocukların gözlerini açtığı ve çocuğu olmayan kadınlara bereket duası ettiği konuşulmaktadır (tıpkı <a class=\"entity-link\" href=\"#npc-elize-variana\" data-route=\"npc-elize-variana\">Azize Elize Variana</a>'nın mucizeleri gibi). Gezgin rahip <a class=\"entity-link\" href=\"#npc-vilgo-kulsakak\" data-route=\"npc-vilgo-kulsakak\">Vilgo Külşakak</a> bu vaizin adını daha önce hiç duymamıştır."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-6",
                              "label": "Bölüm 6: Sahne 3 ve 5"
                        }
                  ]
            },
            "npc-vilgo-kulsakak": {
                  "category": "npc",
                  "typeLabel": "NPC • Gezgin Buçukluk Rahip",
                  "title": "Vilgo (Nordan) Külşakak ve Kedisi Minnak",
                  "meta": "107 Yaşında Halfling • Zindalibab Rahibi",
                  "sections": [
                        {
                              "heading": "Fiziksel Görünüm ve Binek Kedisi Minnak",
                              "body": "107 yaşında, şakakları kül rengi kırlaşmış, neşeli ve bilge bir buçukluk (halfling) rahibidir. Yanında kangal köpeği büyüklüğünde, vaşak kırması devasa binek kedisi <strong>Minnak</strong> ile seyahat eder."
                        },
                        {
                              "heading": "Hikâyedeki Rolü (Insight 24)",
                              "body": "6. Bölümde gece Brevista yolunda Taşboğaz'daki sülükçü akrabalarına giderken <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>'in faytonuna alınır. Macera, aile ve yol tanrısı <a class=\"entity-link\" href=\"#kural-zindalibab\" data-route=\"kural-zindalibab\">Zindalibab</a> rahibidir. Alarik ile tütün değiş-tokuşu yapar, <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Peder Martin</a>'in ölümüne çok üzülür ve <em>Legendarium</em> parşömeninden dua okuyarak ekibe <strong>Bless</strong> büyüsü yapar."
                        }
                  ],
                  "appearances": [
                        {
                              "chapterId": "bolum-6",
                              "label": "Bölüm 6: Sahne 5"
                        }
                  ]
            },
            "loc-gumuslu": {
                  "category": "location",
                  "typeLabel": "Mekân • Kasaba",
                  "title": "Gümüşlü Kasabası",
                  "meta": "Batı Kalkanı ile Merkez Eyalet Arasında • Alarik'in Çocukluk Yeri",
                  "sections": [
                        {
                              "heading": "Tarihçe ve Atmosfer",
                              "body": "İmparatorluğun beyni (Batı Kalkanı) ile kalbi (Merkez Eyalet) arasında yer alan eski bir maden kasabasıdır. Ticaret rotalarının değişmesi ve gümüş madenlerinin veriminin düşmesiyle gözden düşmüş; yalnızca Von Karter Ailesi'nin eski türbeyi <a class=\"entity-link\" href=\"#loc-variana-yetimhanesi\" data-route=\"loc-variana-yetimhanesi\">Azize Variana Yetimhanesi</a>'ne çevirtmesiyle ayakta kalabilmiştir."
                        }

                  "category": "location",
                  "typeLabel": "Mekân • Yetimhane ve Türbe",
                  "title": "Azize Variana Yetimhanesi",
                  "meta": "Gümüşlü Kasabası • Yönetici: Peder Gaius Morden",
                  "sections": [
                        {
                              "heading": "Yapısı ve Önemli Olaylar",
                              "body": "<a class=\"entity-link\" href=\"#npc-elize-variana\" data-route=\"npc-elize-variana\">Azize Elize Variana</a>'nın türbesi etrafına Von Karter Ailesi'nin bağışlarıyla kurulmuş taş yetimhanedir. Yöneticisi <a class=\"entity-link\" href=\"#npc-gaius-morden\" data-route=\"npc-gaius-morden\">Peder Gaius Morden</a>'dir. 6 yaşındaki <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>, bodrumdaki <strong>kazan dairesinde</strong> kendisini ezen <a class=\"entity-link\" href=\"#npc-duncan\" data-route=\"npc-duncan\">Duncan</a> ve 3 arkadaşını kaynar suyla haşlamış, <a class=\"entity-link\" href=\"#npc-annie\" data-route=\"npc-annie\">Annie</a> ile türbe nöbeti tutmuş ve buradan Engizisyon'a teslim edilmiştir."
                        }
                  ],

            "loc-kankaya-mevkii": {

                  "typeLabel": "Mekân • Coğrafi Bölge",
                  "title": "Kankaya Mevkii",
                  "meta": "Merkez Eyalet Kuzeydoğusu • Delok Nehri Kuzeyi",
                  "sections": [
                        {
                              "heading": "Coğrafi Özellikler (History 22)",
                              "body": "Merkez Eyalet'in kuzeydoğusunda, Delok Nehri'nin kuzeyinde yer alan soğuk, rüzgârlı ve tepelik bölgedir. Adını topraktan ve kayalardan çıkan kızıl renkli <strong>zincifre (yabani cıva cevheri)</strong> damarlarından alır. Kuzeyinden <a class=\"entity-link\" href=\"#loc-marsik-deresi\" data-route=\"loc-marsik-deresi\">Marsık Deresi</a> geçer; doğusunda Dağdibi sınırındaki <strong>Vulnus Pontem (Yaralı Geçit)</strong> ve <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista (Kızılkent)</a> yer alır."

            "loc-tepeli-ambar-mezarligi": {
                  "category": "location",
                  "typeLabel": "Mekân • Kutsanmış Mezarlık ve Üs",

                  "sections": [
                        {
                              "heading": "Fiziksel Yapısı",
                              "body": "Kasabanın hemen dışında, taş kapısında Amarath kazanı ve <a class=\"entity-link\" href=\"#kural-way-of-mercy\" data-route=\"kural-way-of-mercy\">Way of Mercy</a> kitabından alınan <strong>'Nihilominus misericordiam spero'</strong> (<em>Yine de merhamet umarım</em>) yazıtı bulunan eski mezarlıktır. İçinde 90 yaşındaki <a class=\"entity-link\" href=\"#npc-welford\" data-route=\"npc-welford\">Mezarcı Welford</a>'un kulübesi ve cesetlerin bozulmadan saklandığı yarı yeraltı <strong>soğuk taş oda (morg)</strong> yer alır."
                        },
                        {
                              "heading": "Hikâyedeki Rolü",
                              "body": "<a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>'in Tepeli Ambar'daki güvenli operasyon üssüdür. <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Rahip Martin</a>'in otopsisi burada yapılmış, Martin ve <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a> buraya defnedilmiş, <a class=\"entity-link\" href=\"#npc-marinette-sermon\" data-route=\"npc-marinette-sermon\">Marinette Sermon</a> ve <a class=\"entity-link\" href=\"#npc-ulak-konrad\" data-route=\"npc-ulak-konrad\">Ulak Konrad</a> gece buraya gelmiş, 5. Bölüm sonunda ise <a class=\"entity-link\" href=\"#npc-yanik\" data-route=\"npc-yanik\">Faytoncu Yanik</a> mezarlık kapısı önünde ikinci kan kusturma saldırısına uğramış ve <a class=\"entity-link\" href=\"#npc-arlen\" data-route=\"npc-arlen\">Arlen</a> tarafından burada kurtarılmıştır."
