<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İz Peşinde — DM Macera Rehberi</title>
  <style>
    :root {
      --bg: #f7f1e5;
      --surface: #ede4d2;
      --surface-alt: #e4d8c1;
      --primary: #6e221b;
      --primary-hover: #8a2c23;
      --accent: #967346;
      --border: #c9b592;
      --text: #231e1c;
      --muted: #5a4d44;
      --sidebar-w: 290px;
      --font-serif: Georgia, 'Liberation Serif', 'Times New Roman', serif;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-serif);
      font-size: 16.5px;
      line-height: 1.68;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout Shell */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Mobile Topbar */
    .mobile-header {
      display: none;
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 2px solid var(--primary);
      padding: 10px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .mobile-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--primary);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .menu-btn {
      background: var(--primary);
      color: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 6px 12px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-brand {
      padding: 18px 16px 14px;
      border-bottom: 2px solid var(--primary);
      background: linear-gradient(180deg, rgba(110, 34, 27, 0.08) 0%, transparent 100%);
    }
    .sidebar-brand .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3px;
    }
    .sidebar-brand h1 {
      margin: 0;
      font-size: 1.35rem;
      color: var(--primary);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .sidebar-brand .sub {
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
      margin-top: 4px;
    }

    .search-wrap {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
    }

    .nav-tree {
      padding: 10px 10px 28px;
      flex: 1;
    }
    .nav-group {
      margin-bottom: 14px;
    }
    .nav-group-title {
      font-family: var(--font-sans);
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--accent);
      padding: 4px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 5px;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }
    .nav-item:hover {
      background: var(--surface-alt);
      color: var(--primary);
    }
    .nav-item.active {
      background: var(--primary);
      color: var(--bg);
      font-weight: 600;
    }
    .nav-sub-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-left: 2px solid var(--border);
      padding: 4px 10px 4px 14px;
      margin-left: 10px;
      font-family: var(--font-sans);
      font-size: 0.81rem;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
    }
    .nav-sub-item:hover {
      color: var(--primary);
      border-left-color: var(--primary);
    }
    .nav-badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(150, 115, 70, 0.22);
      color: var(--muted);
      margin-left: 6px;
      vertical-align: middle;
    }
    .nav-item.active .nav-badge {
      background: rgba(247, 241, 229, 0.22);
      color: var(--bg);
    }

    /* Main Content */
    .main-wrap {
      flex: 1;
      min-width: 0;
      padding: 28px 34px 64px;
    }
    .content-container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* Back Bar */
    .back-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }
    .back-btn:hover { background: var(--primary-hover); }
    .breadcrumb {
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* Banner & Typography */
    .module-banner {
      border-top: 3px solid var(--primary);
      border-bottom: 3px solid var(--primary);
      padding: 18px 14px 16px;
      margin-bottom: 22px;
      text-align: center;
      background: linear-gradient(180deg, rgba(150, 115, 70, 0.1) 0%, rgba(150, 115, 70, 0.02) 100%);
    }
    .module-banner .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .module-banner h2 {
      margin: 0 0 6px;
      font-size: 1.85rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      border: none;
      padding: 0;
    }
    .module-banner .subtitle {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
      font-style: italic;
    }

    h2.section-title {
      font-size: 1.35rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 5px;
      margin: 28px 0 14px;
    }
    h3.scene-title {
      font-size: 1.15rem;
      color: var(--primary);
      margin: 22px 0 8px;
      scroll-margin-top: 20px;
    }
    p { margin: 0 0 12px; }
    ul { margin: 0 0 14px; padding-left: 22px; }
    li { margin-bottom: 6px; }

    /* Entity Links */
    a.entity-link {
      color: var(--primary);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-underline-offset: 3px;
      cursor: pointer;
    }
    a.entity-link:hover {
      background: rgba(150, 115, 70, 0.16);
      border-radius: 2px;
    }

    /* Callouts & Boxes */
    .callout {
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      padding: 14px 18px;
      margin: 18px 0;
    }
    .callout-title {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .read-aloud {
      background: rgba(150, 115, 70, 0.1);
      border-left: 3.5px solid var(--accent);
      padding: 12px 16px;
      margin: 14px 0;
      font-style: italic;
    }
    .placeholder-box {
      border: 1.5px dashed var(--primary);
      background: rgba(110, 34, 27, 0.04);
      padding: 14px 18px;
      margin: 18px 0;
      border-radius: 4px;
    }
    .placeholder-label {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    /* Entity Detail Page */
    .entity-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-top: 4px solid var(--primary);
      border-radius: 4px;
      padding: 20px 22px;
      margin-bottom: 20px;
    }
    .entity-type-tag {
      font-family: var(--font-sans);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .entity-card h2 {
      margin: 0 0 6px;
      font-size: 1.6rem;
      color: var(--primary);
    }
    .entity-meta {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--muted);
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 14px 0 18px;
    }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: center;
      padding: 8px 4px;
      font-family: var(--font-sans);
    }
    .stat-box .lbl {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-box .val {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
    }
    .stat-box .mod {
      font-size: 0.8rem;
      color: var(--text);
    }

    .detail-block {
      margin-bottom: 14px;
    }
    .detail-block h4 {
      font-family: var(--font-sans);
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin: 0 0 4px;
    }

    .related-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-family: var(--font-sans);
      font-size: 0.86rem;
    }

    /* Mobile Drawer */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 14, 12, 0.5);
      z-index: 45;
    }
    .drawer-backdrop.open { display: block; }

    @media (max-width: 899px) {
      .app-shell { flex-direction: column; }
      .mobile-header { display: flex; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: 4px 0 18px rgba(0, 0, 0, 0.22);
      }
      .sidebar.open { transform: translateX(0); }
      .main-wrap { padding: 18px 16px 48px; }
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="mobile-header">
    <div class="mobile-title">İz Peşinde • DM Rehberi</div>
    <button type="button" class="menu-btn" id="mobileMenuBtn">☰ İçindekiler</button>
  </div>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="eyebrow">Lands of Exile • 1v1 Solo</div>
        <h1>İz Peşinde</h1>
        <div class="sub">Oynatılabilir DM Modül Rehberi</div>
      </div>
      <div class="search-wrap">
        <input type="search" class="search-input" id="searchInput" placeholder="Bölüm, NPC veya mekân ara...">
      </div>
      <nav class="nav-tree" id="navTree"></nav>
    </aside>

    <main class="main-wrap">
      <div class="content-container" id="mainContent"></div>
    </main>
  </div>

  <script>
    // =========================================================================
    // GENİŞLETİLEBİLİR VERİ YAPISI (ADVENTURE_DATA)
    // Yeni bölümler çıktıkça 'chapters' dizisine ekleyebilir, var olan NPC ve
    // mekânların bilgilerini 'entities' altından güncelleyebilirsiniz.
    // =========================================================================
    const ADVENTURE_DATA = {
      "chapters": [
            {
                  "id": "bolum-1",
                  "title": "Bölüm 1: Ezberden İlk İmtihan",
                  "badge": "Bölüm 1",
                  "subtitle": "Sürgün Toprakları, Azize Variana Yetimhanesi, Kan Değirmeni Karakolu ve Tepeli Ambar'da Kanlı Vaaz • DM: Ömer (Haleciğer) • Oyuncu: Fatih (Kara Alarik)",
                  "scenes": [
                        {
                              "id": "b1-s1",
                              "title": "Sahne 1: Sürgün Toprakları, Gümüşlü Kasabası ve Azize Variana Yetimhanesi"
                        },
                        {
                              "id": "b1-s2",
                              "title": "Sahne 2: Kazan Dairesi İmtihanı, Peder Gaius Morden ve Annie"
                        },
                        {
                              "id": "b1-s3",
                              "title": "Sahne 3: Engizisyona Teslim Ediliş ve 20 Yıllık Tedrisat"
                        },
                        {
                              "id": "b1-s4",
                              "title": "Sahne 4: Kankaya Mevkii ve Kan Değirmeni Karakolu"
                        },
                        {
                              "id": "b1-s5",
                              "title": "Sahne 5: Vekil Kumandan Godfrey ve Gözcü'nün Kehaneti"
                        },
                        {
                              "id": "b1-s6",
                              "title": "Sahne 6: Mücahit Haldo, Kırsalda Kamp ve Vaaz Meydanı'nda Kanlı Ölüm"
                        }
                  ],
                  "html": "\n            <div class=\"module-banner\">\n              <div class=\"eyebrow\">İz Peşinde • Oyun Yöneticisi Modülü • 1. Oturum</div>\n              <h2>Bölüm 1: Ezberden İlk İmtihan</h2>\n              <p class=\"subtitle\">Lands of Exile Evreninde Tek Oyunculu (1v1) Dedektiflik ve Engizisyon Macerası • Kaynak: Attack Roll</p>\n            </div>\n\n            <div class=\"callout\">\n              <div class=\"callout-title\">Sürgün Topraklarında: Evren ve Masa Kuralları</div>\n              <p><strong>Tarihsel Dönem:</strong> Zafer Günü'nden sonra 3. yüzyılın ikinci yarısı (250'li yılların sonu). İmparator <strong>Falkret</strong> (\"Kaşif\") dönemi devam etmektedir. Kuzeydeki Donmuş Menzil'den güneyin çorak topraklarına, Sarı Deniz'den Özgür Limanlar ötesindeki kolonilere kadar bilinen dünyanın tek hâkimi olan İmparatorluk, Fırtınanın Gözü'nün ötesinde yeni bir kıta bulmuştur. Doğu Hanlığı ve Bozkır ordaları İmparatorluğa kayıtsız kalamayacağını anlamış, güneyde orman elfleri Leydi'nin dönüşü sonrası nehri geçmiştir.</p>\n              <p style=\"margin-bottom:0;\"><strong>Masa ve Karakter Kuralları:</strong> Oyuncu seriye 0 noktasında <strong>1 adet Inspiration</strong> ile başlar (<a class=\"entity-link\" href=\"#kural-inspiration\" data-route=\"kural-inspiration\">Başlangıç Inspiration Kuralı</a>). Karakterimiz <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>, 3. seviye bir <em>Inquisitive Rogue</em> ve ev yapımı <a class=\"entity-link\" href=\"#kural-cadi-avcisi\" data-route=\"kural-cadi-avcisi\">Cadı Avcısı (Witch Hunter)</a> geçmişine sahip bir Engizisyon Avcısıdır. Suç dünyası yerine tamamen Engizisyon istihbarat ve sorgu eğitimi almıştır; <em>Thieves' Cant</em> yerine <a class=\"entity-link\" href=\"#kural-lingua-imperium\" data-route=\"kural-lingua-imperium\">Lingua Imperium</a>, <em>Prodigy</em> hüneriyle ise iblislerin dili olan <a class=\"entity-link\" href=\"#kural-abyssal\" data-route=\"kural-abyssal\">Abyssal / Infernal (Düşmanın Dili)</a> konuşur.</p>\n            </div>\n\n            <h2 class=\"section-title\">Bölüm Akışı</h2>\n\n            <h3 class=\"scene-title\" id=\"b1-s1\">Sahne 1: Sürgün Toprakları, Gümüşlü Kasabası ve Azize Variana Yetimhanesi</h3>\n            <p>Oyun, İmparatorluğun panoraması ve Batı Kalkanı ile Merkez Eyalet arasındaki <a class=\"entity-link\" href=\"#loc-gumuslu\" data-route=\"loc-gumuslu\">Gümüşlü Kasabası</a> ile açılır. Ticaret yollarının değişmesi ve gümüş madenlerinin veriminin düşmesiyle sönükleşen kasaba, <strong>Von Karter Ailesi</strong>'nin eski bir türbeyi <a class=\"entity-link\" href=\"#loc-variana-yetimhanesi\" data-route=\"loc-variana-yetimhanesi\">Azize Variana Yetimhanesi</a>'ne çevirtmesiyle ayakta kalmıştır.</p>\n\n            <div class=\"read-aloud\">\n              \"Zafer Günü'nden sonra 3. yüzyılın ikinci yarısındayız; 250'lerin sonu. Kuzeydeki Donmuş Menzil'den güneyin felaket görmüş çorak topraklarına, güneşe en yakın Sarı Deniz'den batıdaki Özgür Limanlar'ın ötesindeki kolonize edilmiş adalara kadar bilinen dünyanın tek hâkimi olan İmparatorluk, bendine sığmayarak Fırtınanın Gözü'nün ötesinde yeni bir kıta buldu. Kartal'ın yeni bir aşiyan bulduğu kesin... Böyle bir zamanda, İmparatorluğun beyni ile kalbi arasında —Batı Kalkanı ile Merkez Eyalet arasında— sadece maharetli haritacıların, memurların ya da maceracıların bildiği Gümüşlü Kasabası vardır.\"\n            </div>\n\n            <ul>\n              <li><strong>Zar Kontrolü — Religion (DC 15 / Örnek Zar: 16 + 5 = 21):</strong> <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>, yetimhaneye adını veren <a class=\"entity-link\" href=\"#npc-elize-variana\" data-route=\"npc-elize-variana\">Azize Elize Variana</a> hakkındaki tüm dini kayıtları hatırlar. Zafer Günü'nden yaklaşık 300 yıl önce yaşamış gezgin bir <a class=\"entity-link\" href=\"#kural-amarath\" data-route=\"kural-amarath\">Amarath</a> rahibesi olan Variana'nın Tapınakça kabul edilen iki büyük mucizesi vardır: (1) Kaybolmuş ağır yaralı bir şövalyeyi mucizevi biçimde iyileştirerek taşıdığı emri ulaştırmasını ve büyük bir felaketi önlemesini sağlaması; (2) Soylu bir adamın savaştan kör dönen tek oğlunun gözlerini duasıyla açması.</li>\n              <li><strong>Zar Kontrolü — History (DC 15 / Örnek Zar: 15 + 3 = 18):</strong> Yetimhanenin yöneticisi <a class=\"entity-link\" href=\"#npc-gaius-morden\" data-route=\"npc-gaius-morden\">Peder Gaius Morden</a>, Merkez Eyalet vatandaşlığı olan genç bir <a class=\"entity-link\" href=\"#kural-alarath\" data-route=\"kural-alarath\">Alarath</a> vaizidir. Doğuştan bir gözü şehladır; İmparatorlukta fiziksel kusurlar ruhun kusuru sayıldığı için büyük şehirlerdeki tarihi şapeller yerine bu taşra yetimhanesine atanmıştır. Yine de bağış paralarını yemeyen, yetimleri kasabalıya ezdirmeyen idealist bir yöneticidir.</li>\n              <li><strong>Zorbalık Düzeni:</strong> 6 yaşındaki Alarik, <a class=\"entity-link\" href=\"#kural-lingua-imperium\" data-route=\"kural-lingua-imperium\">Lingua Imperium</a> dilindeki ayetleri hapse düşen kasabın iri oğlu <a class=\"entity-link\" href=\"#npc-duncan\" data-route=\"npc-duncan\">Duncan</a> ve üç arkadaşından çok daha iyi okuyunca, Peder Gaius onu akşamları Duncan'a ders vermekle görevlendirir. Bunu gururuna yediremeyen Duncan ve üç arkadaşı, 10 gün boyunca küçük Alarik'e ağır zorbalık yapar.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b1-s2\">Sahne 2: Kazan Dairesi İmtihanı, Peder Gaius Morden ve Annie</h3>\n            <p>Onuncu günün gecesinde 6 yaşındaki <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Alarik</a>, sorunu kökünden çözmek için soğukkanlı bir tuzak kurar: Kazan dairesinde acı bir çığlık atarak <a class=\"entity-link\" href=\"#npc-duncan\" data-route=\"npc-duncan\">Duncan</a> ve üç arkadaşını içeri çeker, kaynar su kazanlarını üzerlerine devirip kapıyı dışarıdan kirişleyerek dördünü de ağır şekilde haşlar.</p>\n\n            <ul>\n              <li><strong>Peder Gaius'un Odasında Sorgu:</strong> Haşlanan zorbalar ağlayarak <em>\"Çığlık duyduk, yardım etmeye gittik, bu çocuk şeytan!\"</em> diye yalan söylerken, Alarik'ten 2-3 yaş büyük, çilli ve eli maşalı yetim kız <a class=\"entity-link\" href=\"#npc-annie\" data-route=\"npc-annie\">Annie</a> odaya dalarak <em>\"Peder, yalan söylüyorlar! Alarik'i durmadan sıkıştırdılar, çocuk kendini korumaya çalışmıştır!\"</em> diye onu savunur.</li>\n              <li><strong>Zar Kontrolü — Intimidation (Örnek Zar: 10 + 5 = 15):</strong> Peder Gaius diğer çocukları dışarı çıkarırken Alarik, yanından geçen zorbaların gözlerinin içine bakarak fısıldar: <em>\"Annie'nin canını sıkarsanız tekrar yakarım sizi.\"</em></li>\n              <li><strong>Dürüst İtiraf ve Siyah Kitap:</strong> Alarik, Tanrı hizmetkârının önünde yalan söyleyerek kendi şerefine ve ruhuna zarar vermeyeceğini belirtip onları kazan dairesine kasten çektiğini itiraf eder.\n                <ul>\n                  <li><strong>Zar Kontrolü — Insight (Örnek Zar: 2 + 7 = 9):</strong> Alarik, Peder Gaius'un kendisini yetimhaneden atacağını sanır. Ancak Gaius ona şu sözleri söyler: <em>\"Tanrılar herkesin yolunu farklı yerlerden geçirir. Bazılarımız karanlığa karşı kıvılcım olurken bazılarımız kandil, bazılarımız da sadece ayna olabilir... Madem ceza vermeyi kendine hak görüyorsun, en azından öğren ne olduğunu.\"</em></li>\n                  <li>Gaius, çekmecesinden <strong>Rahip Vaden Polit</strong>'in yazdığı siyah ciltli <a class=\"entity-link\" href=\"#kural-infazin-yukumlulukleri\" data-route=\"kural-infazin-yukumlulukleri\">İnfazın Yükümlülükleri</a> kitabını çıkarıp küçük Alarik'e verir.</li>\n                </ul>\n              </li>\n              <li><strong>Annie'nin Tokadı ve Türbe Nöbeti:</strong> Odadan çıktığında <a class=\"entity-link\" href=\"#npc-annie\" data-route=\"npc-annie\">Annie</a> Alarik'in yanağına sert bir tokat atar (<em>\"Salak! Bunun çözümü bu mu?\"</em>), ancak hemen ardından <em>\"Bugün gözümün önünde dur, bir yere kaçma. Türbeye gidelim, nöbetçi benim\"</em> diyerek gün boyu onu diğer çocukların intikamından korur.\n                <ul>\n                  <li><strong>Zar Kontrolü — Perception / Insight (Örnek Zar: 5 + 7 = 12):</strong> Yetimhanedeki diğer çocuklar artık Alarik'e bir canavarmış gibi korkuyla bakmaktadır. Alarik, diğerlerinin güvende olması için kendisinden korkmaları gerekiyorsa bu yalnızlığı kabullenir.</li>\n                </ul>\n              </li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b1-s3\">Sahne 3: Engizisyona Teslim Ediliş ve 20 Yıllık Tedrisat</h3>\n            <p>Olaydan birkaç gün sonra gece yarısı <a class=\"entity-link\" href=\"#npc-gaius-morden\" data-route=\"npc-gaius-morden\">Peder Gaius</a> Alarik'i uyandırıp eşyalarını toplamasını söyler (<strong>Insight: 6 + 7 = 13</strong> — Alarik yetimhaneden kovulduğunu sanır). Çuvalına yalnızca kışlık pançosunu ve siyah kitabı koyup Gaius'un odasına girer.</p>\n\n            <div class=\"read-aloud\">\n              \"Karanlık koridorda yürüyorsun ve yalnızca aralık kapısından ışık sızan odaya giriyorsunuz. İçeri girdiğin anda gözüne sobadan kor ateşin kızıl ışığı vuruyor. Sobanın tam önünde, senin için çok karanlık gözüken iki uzun adam var. Üzerlerinde uzun seyahat pelerinleri, yerde çamurlu botları... Biri enine geniş, oldukça iri bir adam; kızıl ışık yüzüne vurduğunda yüzünde boydan boya, kasten çizilmiş dikine kesikler olduğunu görüyorsun. Diğeri ise kır sakallı, 50'lerinde yaşlıca bir adam.\"\n            </div>\n\n            <ul>\n              <li><strong>Zar Kontrolü — Perception (Örnek Zar: 8 + 7 = 15):</strong> İri yarı kesik yüzlü Engizisyoncu <a class=\"entity-link\" href=\"#npc-vaden-nikolas\" data-route=\"npc-vaden-nikolas\">Vaden</a> ve kır sakallı yaşlı Engizisyoncu <a class=\"entity-link\" href=\"#npc-vaden-nikolas\" data-route=\"npc-vaden-nikolas\">Nikolas</a> çocuğu süzer. Nikolas, Vaden'e dönerek <em>\"Düşündüğümden daha zayıf... Ama yılanlar da zayıf olur\"</em> der.</li>\n              <li><strong>20 Yıllık Doktrinasyon:</strong> Alarik çocuk yaştan itibaren Engizisyon'un karanlık kuyularında, açlık ve işkence altında hatasız ayet okuma imtihanlarından geçer. Fiziksel kuvvet eksikliğini çeviklik, nişancılık, zehir bilgisi ve keskin algısıyla kapatır; önce <strong>Sorguç</strong>, 6 ay önce ise siyah tokalı şapka takma hakkı kazanarak <strong>Avcı</strong> olur.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b1-s4\">Sahne 4: Kankaya Mevkii ve Kan Değirmeni Karakolu</h3>\n            <p>Hikâye 20 yıl sonrasına, 25 yaşındaki <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>'in 8 aydır (2 ay Sorguç, 6 ay Avcı olarak) görev yaptığı <a class=\"entity-link\" href=\"#loc-kankaya-mevkii\" data-route=\"loc-kankaya-mevkii\">Kankaya Mevkii</a>'ndeki <a class=\"entity-link\" href=\"#loc-kan-degirmeni\" data-route=\"loc-kan-degirmeni\">Merkez Eyalet 3. Doğu Karakolu (Kan Değirmeni)</a>'na gelir.</p>\n\n            <ul>\n              <li><strong>Zar Kontrolü — History (Karakol: Avantajlı 12 + 3 = 15 • Bölge: 19 + 3 = 22):</strong>\n                <ul>\n                  <li><a class=\"entity-link\" href=\"#loc-kankaya-mevkii\" data-route=\"loc-kankaya-mevkii\">Kankaya Mevkii</a>, Merkez Eyalet'in kuzeydoğusunda, Delok Nehri'nin kuzeyinde, topraktan kızıl renkli <strong>zincifre (yabani cıva cevheri)</strong> çıkan soğuk ve tepelik bir coğrafyadır. Kuzeyinden <a class=\"entity-link\" href=\"#loc-marsik-deresi\" data-route=\"loc-marsik-deresi\">Marsık Deresi</a> akar; doğusunda Dağdibi sınırındaki <strong>Vulnus Pontem (Yaralı Geçit)</strong> üzerinde stratejik sınır kenti <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista (Kızılkent)</a> yükselir.</li>\n                  <li><a class=\"entity-link\" href=\"#loc-kan-degirmeni\" data-route=\"loc-kan-degirmeni\">Kan Değirmeni Karakolu</a>, günümüzden ~150 yıl önce (Engizisyon'un henüz kanunsuz olduğu dönemde) <strong>Kulaksız Manfred</strong> adlı radikal bir engizitörün yıkık bir yel değirmenini üs edinip sapkın bir soylu aileyi katlettiği yerdir. Bugün karakolda 1 Avcı Kumandan (Peter Gerlach — uzakta görevde), 2 Avcı Kaptan, 5 Avcı, 7-8 Sorguç ve 15'ten fazla Mücahit/Yobaz görev yapmaktadır.</li>\n                </ul>\n              </li>\n              <li><strong>Avluda İçtima ve Kitap Okuma:</strong> Avluda kazanlarda gümüş ve kutsal eşyalarla su kutsanırken, Alarik'in karakoldaki tek dostu olan <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Mücahit Haldo</a> gür sesiyle ayetler okumaktadır. Alarik ise yürürken çocukluğundan beri yanından ayırmadığı <a class=\"entity-link\" href=\"#kural-infazin-yukumlulukleri\" data-route=\"kural-infazin-yukumlulukleri\">İnfazın Yükümlülükleri</a> kitabını okur:</li>\n            </ul>\n\n            <div class=\"read-aloud\">\n              \"Şüphe yoktur ki infazı gerçekleştirecek kişilerde pek çok faziletin var olması gerekir... Örneğin bir kemanın en kalın teli, yayın vurmasıyla temiz bir sol sesi çıkarsa bundan memnuniyet duyar mı? Sadece vazifesi ve hatta vazifeden de öte tabiatının yalnız açıklayıcısı o notayı doğru çalmak olduğundan, bu onda herhangi bir etkileşim yaratmaz. İnfazı yaratacak kimse de yapması gerekeni gerektiğinden değil, zaten olağan akışın bir parçası ve eşyanın fıtratı gereğince yapmalı; bu yapış hali ise bir irade değil, yeni yanan bir ışığın koridoru aydınlatması kadar içkin ve doğal olmalıdır.\"\n            </div>\n\n            <ul>\n              <li><strong>Zar Kontrolü — Perception (Örnek Zar: 5 + 7 = 12):</strong> Genç bir Sorguç nefes nefese gelip Vekil Kumandan'ın Alarik'i çağırdığını bildirir. Alarik, diğer avcıların aksine çocuğu tokatlamak yerine açık kalmış gömlek düğmelerini sessizce ilikleyip omzuna hafifçe vurur ve değirmen kulesine çıkar.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b1-s5\">Sahne 5: Vekil Kumandan Godfrey ve Gözcü'nün Kehaneti</h3>\n            <p>Değirmen kulesinin en üst katında Vekil Avcı Kumandan <a class=\"entity-link\" href=\"#npc-godfrey\" data-route=\"npc-godfrey\">Pınaryurtlu Godfrey</a> Alarik'i karşılar.</p>\n\n            <ul>\n              <li><strong>Zar Kontrolü — History (DC 14 / Örnek Zar: 12 + 3 = 15):</strong> <a class=\"entity-link\" href=\"#npc-godfrey\" data-route=\"npc-godfrey\">Pınaryurtlu Godfrey</a>, 27 yaşında Avcı Kaptan olmuş, ancak 30'larının başında Akşelale'de soylu bir ailenin oğlunu vurduğu için 2,5 yıl ağır hapis ve işkence görmüştür. Aile davayı çekince serbest kalmış fakat 10 yıldır bu taşra karakoluna masa başı sürgüne gönderilmiştir. Sağ elinin üzerinde hapishane dövmesi olarak <strong>\"Deo Volente\"</strong> (Tanrı'nın İzniyle) yazılıdır.</li>\n              <li><strong>Mukaddes Silah ve Vazife Emri:</strong> Godfrey, Alarik'e kabzasının altında <strong>\"A\"</strong> harfi işlenmiş bir <strong>Flintlock Tabanca</strong>, 24 normal mermi, barut kesesi ve <strong>1 adet kutsanmış mermi</strong> teslim eder. Görevi: Yanına bir mücahit alarak <a class=\"entity-link\" href=\"#loc-tepeli-ambar\" data-route=\"loc-tepeli-ambar\">Tepeli Ambar</a> kasabasına gitmek, <a class=\"entity-link\" href=\"#npc-gozcu\" data-route=\"npc-gozcu\">Gözcü</a>'den alacağı emaneti <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Gezgin Rahip Martin</a>'e ulaştırmak ve rahibin vazifesini tamamladığından emin olmaktır. Godfrey ayrıca resmi mühürlü bir <strong>Şehadet İzin Belgesi</strong> verir.</li>\n              <li><strong>3 Numaralı Hücre ve Gözcü:</strong> Alarik yemek tepsisiyle yeraltındaki işkence katlarının en dibine, demir kapılı 3 Numaralı Hücreye iner. Alnının ortasında tekrar tekrar kesilerek açılmış üçüncü göz yarası bulunan yaşlı kahin <a class=\"entity-link\" href=\"#npc-gozcu\" data-route=\"npc-gozcu\">Gözcü</a> ile görüşür (<strong>Insight: 17 + 7 = 24</strong> — Gözcü kendi varlığından ve yeteneğinden tiksinmekte, duvarlara kazınmış <em>\"Affet\"</em> ve <em>\"Kefaret\"</em> yazıları arasında vazifesini yapmaktadır).</li>\n              <li><strong>Mukaddes Emanet — Zar Kontrolü: Religion (DC 12 / Örnek Zar: 9 + 5 = 14):</strong> Gözcü, çuval içinde <a class=\"entity-link\" href=\"#kural-godwin-haten-maniple\" data-route=\"kural-godwin-haten-maniple\">Şehit Rahip Godwin Haten'in Maniplesi</a>'ni teslim eder. Godwin Haten, İmparator Konrad dönemindeki Karanlıkaltı (Underdark) seferberliğine gönüllü sıhhiye olarak katılıp şehit düşmüş büyük bir Amarath rahibidir. Alarik, manipleyi çamurdan korumak için yeni tabancasının ahşap kutusunun iç kalıbını söküp kutuya yerleştirir ve iple sıkıca sarar.</li>\n              <li><strong>Kutsanmış Mermi Uyarısı ve Kehanet (Şans Zarı %50: 11 — Başarılı):</strong> Gözcü, Rahip Martin vazifeden döner veya kuşkuya düşerse kutsanmış mermiyi rahibe (veya gerekirse kendisine) sıkmasını tembihler ve Alarik'e şahsi istiharesini fısıldar:</li>\n            </ul>\n\n            <div class=\"read-aloud\">\n              \"Kandan ağır kızıllık çöktüğünde, seher yolunda bir akbaba çığlık atacak. Günün kabri istikametinde düşen kuşku; çoğu az, hayrı şer, baharı kış edecek... Kaderin değerli; soyunu devam ettirmelisin ama ondan önce kendini devam ettirmelisin. Işık hemen sönerse bir değeri yok, karanlığa karşı en azından aydınlatmalı.\"\n            </div>\n\n            <h3 class=\"scene-title\" id=\"b1-s6\">Sahne 6: Mücahit Haldo, Kırsalda Kamp ve Vaaz Meydanı'nda Kanlı Ölüm</h3>\n            <p>Alarik avluya çıkıp sunak ateşinin önünde sırtını zincirle kamçılayan ve elini ateşe sokarak <em>\"Ignis purificat, ita Alarath iussit!\"</em> (Ateş arındırır, Alarath böyle buyurdu!) zikri çeken <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Mücahit Haldo</a>'yu yanına alır (<em>\"Haldo, kendin yerine başkasını dövmek ister misin?\"</em>).</p>\n\n            <ul>\n              <li><strong>Zar Kontrolü — Survival (Rota: 11 • Yolculuk Avantajlı: 14 + 5 = 19):</strong> Alarik kendi atı <strong>Namlu</strong> ile, Haldo ise karakol atıyla yola çıkar. Haldo'nun bildiği tepe patikasından 1 saat kazanırlar ve geceyi devrilmiş bir ağacın kayalıklarla oluşturduğu doğal kovukta geçirirler. Şehadet izni olduğunu öğrenen Haldo sevinçten gece boyu elini közde tutarak nöbet bekler.</li>\n              <li><strong>Tepeli Ambar'a Varış (Saat 11:00):</strong> Ertesi gün tepeler üzerine kurulu dev ambarlarıyla bilinen <a class=\"entity-link\" href=\"#loc-tepeli-ambar\" data-route=\"loc-tepeli-ambar\">Tepeli Ambar</a> kasabasına girerler. Kapıda mavi-beyaz kumaşlı, <strong>altın boynuzlu keçi ve altın kabzalı kılıç</strong> armalı paralı askerler nöbet tutmaktadır.</li>\n              <li><strong>Zar Kontrolü — Perception (Örnek Zar: 12):</strong> <a class=\"entity-link\" href=\"#loc-vaaz-meydani\" data-route=\"loc-vaaz-meydani\">Vaaz Meydanı</a>'nda toplanmış kalabalığın ortasında kır saçlı, cübbeli ve çıplak ayaklı <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Gezgin Rahip Martin</a> vaaz vermektedir:</li>\n            </ul>\n\n            <div class=\"read-aloud\">\n              \"Merhamet yolu hiç şüphesiz kızgın taşlar ve kanlı dikenlerle dolu. Peki bu zor yola kimler için çıkılmalı? Düşmanlarımıza göstermek için mi? Eşkıyalığı affetmek için mi? Yoksa önce kendimiz için mi bu yola çıkmalıyız ahali? ... Tanrıların kelamı nettir: Kendinizi, soyunuzu ve komşularınızı koruyun, kollayın ve merhamet edin. Zira Bekçi'ye gidildiğinde hepimizin keskin bir adaletten çok, bir annenin merhametine ihtiyacı olacaktır!\"\n            </div>\n\n            <ul>\n              <li><strong>Zar Kontrolü — Perception (DC 15 / Örnek Zar: 18):</strong> Vaazın son cümlesiyle birlikte Rahip Martin'in burnundan, ağzından ve gözlerinden oluk oluk kan boşalmaya başlar! Kalabalıkta kimse kaçmamaktadır; yalnızca kazınmış kafalı, çıplak ayaklı genç yamak <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a> çığlık atarak kalabalığı yarar ve hocasını tutar. Rahip Martin, Samuel'in kollarında kendi kan gölü içinde can verir.</li>\n            </ul>\n        "

                  "html": "\n            <div class=\"module-banner\">\n              <div class=\"eyebrow\">İz Peşinde • Oyun Yöneticisi Modülü • 2. Oturum</div>\n              <h2>Bölüm 2: Cevaplar ve Daha Derin Sorular</h2>\n              <p class=\"subtitle\">Rahip Martin'in Son 24 Saati, \"Kemikten Kuş Yuvası\" Şifresi ve Tepeli Ambar Soruşturması</p>\n            </div>\n\n            <div class=\"callout\">\n              <div class=\"callout-title\">DM Özeti ve Soruşturma Omurgası</div>\n              <p style=\"margin-bottom:0;\">Bu bölümde <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>, bir yandan <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Gezgin Rahip Martin</a>'in şüpheli ölümünü araştırırken diğer yandan rahibin yarım kalan gizli vazifesini (\"Kemikten kuş yuvasındaki zehirlenen anne kuşu kustur, kusmuğunu sakla\") çözmeye çalışır. Soruşturma; <a class=\"entity-link\" href=\"#loc-tepeli-ambar-mezarligi\" data-route=\"loc-tepeli-ambar-mezarligi\">Tepeli Ambar Mezarlığı</a>, <a class=\"entity-link\" href=\"#loc-gumus-gozlu-tuccar\" data-route=\"loc-gumus-gozlu-tuccar\">Gümüş Gözlü Tüccarın Yeri</a> ve <a class=\"entity-link\" href=\"#loc-canavar-magarasi\" data-route=\"loc-canavar-magarasi\">Canavar Mağarası Tavernası</a> üçgeninde ilerler.</p>\n            </div>\n\n            <h2 class=\"section-title\">Bölüm Akışı</h2>\n\n            <h3 class=\"scene-title\" id=\"b2-s1\">Sahne 1: Meydanda Kargaşa, Havaya Ateş ve Mezarlığa İntikal</h3>\n            <p><a class=\"entity-link\" href=\"#loc-vaaz-meydani\" data-route=\"loc-vaaz-meydani\">Vaaz Meydanı</a>'nda <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Rahip Martin</a>'in kanlar içinde yere yığılmasıyla halk paniğe kapılır. Genç yamak <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a> rahibin başında çaresizce yardım çığlıkları atmaktadır.</p>\n\n            <ul>\n              <li><strong>Ekstra Barut Hesabı:</strong> Alarik'in karakoldan çıkarken yanına aldığı ekstra barut miktarı zarla belirlenir: <code>1d4 (3) + DEX (+4) = +7</code> atımlık ekstra barut.</li>\n              <li><strong>Zar Kontrolü — Perception (8 + 7 = 15) & Intimidation (Avantajlı: 13 + 5 = 18):</strong> <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Haldo</a> kalabalığı fiziksel olarak yararken Alarik, tabancasının namlusundaki mermiyi çıkarıp kesesine koyar ve <strong>sadece barutla havaya ateş eder</strong>. Korkunç patlama sesi ve dumanla birlikte ahali bir Cadı Avcısı geldiğini anlayıp meydanı boşaltır.</li>\n              <li><strong>Zar Kontrolü — Medicine (Avantajlı: 12 + 3 = 15) & Insight (17 + 7 = 24):</strong> Alarik rahibin nabzını yokladığında damarlarının tamamen boşaldığını ve kanının çekilerek öldüğünü fark eder. Şoka girmiş olan <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>'in yüzüne hafif ama net bir tokat atarak onu kendine getirir.</li>\n              <li><strong>Mezarlığa İntikal — Zar Kontrolü: Perception (8 + 7 = 15) & Religion (12 + 5 = 17):</strong> Ceset Samuel'in ikinci cübbesine sarılıp Haldo'nun kucağında kasaba dışındaki <a class=\"entity-link\" href=\"#loc-tepeli-ambar-mezarligi\" data-route=\"loc-tepeli-ambar-mezarligi\">Tepeli Ambar Mezarlığı</a>'na taşınır. Mezarlığın taş kapısında Amarath kazanı motifi ve <a class=\"entity-link\" href=\"#kural-way-of-mercy\" data-route=\"kural-way-of-mercy\">Way of Mercy (Merhametin Yolu)</a> kitabının <em>Vedalar</em> 3. kıssasından alınan <strong>\"Nihilominus misericordiam spero\"</strong> (<em>Yine de merhamet umarım</em>) yazıtı yer almaktadır. 90 yaşlarındaki kekeme mezarlık bekçisi <a class=\"entity-link\" href=\"#npc-welford\" data-route=\"npc-welford\">Welford</a> cesedi yarı yeraltı soğuk taş odaya alır.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b2-s2\">Sahne 2: Samuel'in Sorgusu ve Rahip Martin'in Çantası</h3>\n            <p>Welford aşağıda cesedi incelerken Alarik, mezarlık kulübesinde yamak <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>'i sorgular ve <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Rahip Martin</a>'in son 24 saatini adım adım çıkarır:</p>\n\n            <ul>\n              <li><strong>Rahip Martin'in Son 24 Saati:</strong>\n                <ol>\n                  <li><strong>Dün Sabah:</strong> Kasabaya geldiklerinde Martin, <em>\"Önemli birilerini bekliyoruz, onlar geldikten sonra yakınlardaki eski bir arkadaşımın kızına misafirliğe gideceğiz\"</em> demiştir.</li>\n                  <li><strong>Gümüş Gözlü Tüccarın Yeri:</strong> İlk olarak kasabanın en büyük dükkanına gidip çırakla liste vermiş, dükkan sahibi yarı-elf <a class=\"entity-link\" href=\"#npc-joseph-silvereye\" data-route=\"npc-joseph-silvereye\">Joseph Silvereye</a> ile Elfçe konuşmuştur.</li>\n                  <li><strong>Canavar Mağarası Tavernası:</strong> Ardından Samuel'i kapıda bırakıp <a class=\"entity-link\" href=\"#loc-canavar-magarasi\" data-route=\"loc-canavar-magarasi\">Canavar Mağarası</a> adlı tavernada 50 dakika kalmış; içeriden <strong>çok gergin, ciddi ve suratı asık</strong> çıkmıştır.</li>\n                  <li><strong>Şoförlü At Arabası:</strong> Sokaklarda gergin şekilde yürüdükten sonra akşam vakti önlerinde temiz bir yolcu arabası durmuş; Martin tek başına binip 20 dakika turladıktan sonra arabadan <strong>yüzünde bir gülümsemeyle, tamamen rahatlamış</strong> olarak inmiştir.</li>\n                  <li><strong>Ambar Çatısı ve Sabah:</strong> Geceyi bir ambar saçağı altında şiddetli öksürüklerle geçirmiş, sabah üç kervan muhafızıyla kahvaltı ederken aniden <em>\"Vakit geldi!\"</em> diyerek meydana koşmuş ve 20 dakika vaaz verdikten sonra kan kusarak ölmüştür.</li>\n                </ol>\n              </li>\n              <li><strong>Samuel'in Geçmişi (Insight: 11 + 7 = 18):</strong> Martin, 5 yıl önce <strong>Kırgeçit</strong> kasabasında çocuklara musallat olan bir iblisi kovup Samuel'i yanına almıştır. Buraya gelirken Samuel'e iyi uyumasını ve zayıf bünyesini güçlendirmesini özellikle tembihlemiştir.</li>\n              <li><strong>Rahip Martin'in Çantasından Çıkanlar — Zar Kontrolü: Investigation (19 + 5 = 24):</strong>\n                <ul>\n                  <li><strong>Şifreli Pusula:</strong> Eski bir <a class=\"entity-link\" href=\"#kural-way-of-mercy\" data-route=\"kural-way-of-mercy\">Way of Mercy</a> kitabının <em>Vedalar</em> 3. kıssasında (mezarlık kapısındaki sözün geçtiği sayfada) ayraç olarak duran temiz bir parşömen bulunur. Karakteristik el yazısı izi taşımayan, kusursuz nizami katip harfleriyle (<a class=\"entity-link\" href=\"#kural-lingua-imperium\" data-route=\"kural-lingua-imperium\">Lingua Imperium</a>) şunlar yazılıdır:\n                    <div class=\"read-aloud\" style=\"margin:10px 0;\">\n                      \"Yığınların arasında denkleş. Kemikten kuş yuvasındaki zehirlenen anne kuşu kustur. Kusmuğunu sakla.\"\n                    </div>\n                  </li>\n                  <li><strong>Gizli 27 Altın Sikke:</strong> Çantanın iç astarına dikilmiş gizli kesede %90'ı Merkez Eyalet basımı olan <strong>27 adet yepyeni altın sikke</strong> çıkar. Oysa Martin'in seyahat defterinin son sayfasında, 4-5 ay önce yeni evlenen bir çifte 2 altın 7 gümüş hediye edebilmek için kendi botları dahil tüm eşyalarını sattıkları yazmaktadır (paranın görev için yeni verildiği kesinleşir).</li>\n                </ul>\n              </li>\n              <li><strong>Zar Kontrolü — History (Avantajlı + Inspiration: 17 + 3 = 20):</strong> Alarik, İmparatorluk tarihinde herhangi bir İmparatorun bir kez bile konakladığı şato, kule veya konaklara <strong>\"Aşiyan (Kuş Yuvası)\"</strong> unvanı verildiğini hatırlar!</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b2-s3\">Sahne 3: Soğuk Odada Otopsi ve Mezarcı Welford'un Geçmişi</h3>\n            <p>Alarik soğuk taş odaya inerek <a class=\"entity-link\" href=\"#npc-welford\" data-route=\"npc-welford\">Welford</a>'un otopsi bulgularını dinler.</p>\n\n            <ul>\n              <li><strong>Otopsi Bulguları:</strong> Rahip Martin'in kalbi olağanüstü bir şiddet ve iç basınçla çarpmış; yalnızca ağzından, burnundan ve gözlerinden değil, <strong>bel altındaki deliklerinden de</strong> tüm kanı fışkırarak damarları tamamen boşalmıştır. Welford bunun sıradan bir hayvan/bitki zehri olmadığını (hızlı öldüren zehirlerin iz bıraktığını) belirtir.</li>\n              <li><strong>Zar Kontrolü — Insight (4 + 7 = 11 ve 15 + 7 = 22):</strong> Alarik, Welford'un yüzündeki kesiklerin eski ve nizami <strong>Engizisyon işkence izleri</strong> olduğunu fark eder. Sıkıştırılan Welford, gençliğinde büyük şehirlerde levazımatçılık yaparken Engizisyon avcılarıyla \"hasbihal ettiğini\" ve her zaman tam işbirliği yaptığını itiraf eder. Ayrıca kasabanın en zengin ambar sahibi ve muhtarı <a class=\"entity-link\" href=\"#npc-richmund-sermon\" data-route=\"npc-richmund-sermon\">Richmund Sermon</a>'un ölüm döşeğinde olduğunu söyler.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b2-s4\">Sahne 4: Gümüş Gözlü Tüccarın Yeri ve Joseph Silvereye</h3>\n            <p>Alarik, Haldo ve Samuel'i kapıda bırakarak <a class=\"entity-link\" href=\"#loc-gumus-gozlu-tuccar\" data-route=\"loc-gumus-gozlu-tuccar\">Gümüş Gözlü Tüccarın Yeri</a> adlı büyük dükkana girer. Çırak <strong>James</strong>'i yakasından tutup patronunu çağırtır ve kapının altına ayağıyla ahşap takoz sıkıştırır.</p>\n\n            <ul>\n              <li><strong>Zar Kontrolü — Insight (Ear for Deceit: 8 + 7 = 15):</strong> Dükkan sahibi yarı-elf <a class=\"entity-link\" href=\"#npc-joseph-silvereye\" data-route=\"npc-joseph-silvereye\">Joseph Silvereye (Gümüşgöz)</a>, ellerini tezgahın üstünde tutarak son derece soğukkanlı ve saygılı biçimde bilgi verir. Rahip Martin dün sabah acil olduğunu söyleyerek pazarlıksız <strong>20 altın</strong> peşin ödemiş (böylece Martin'e başta toplam ~47-50 altın verildiği anlaşılır) ve şu paketi hazırlatmıştır:\n                <ul>\n                  <li>Kurutulmuş özel otlar ve baharatlar,</li>\n                  <li>Çuvalla aşırı saf/temiz tuz,</li>\n                  <li>Demircilere özel dövdürülmüş 2–3 metre saf gümüş tel, bolca gümüş tozu ve balmumu,</li>\n                  <li>Küçük el aletleri ve <strong>1 adet kil testi</strong>.</li>\n                </ul>\n              </li>\n              <li><strong>Aktarımsal Arındırım (\"Yansıtmacı Çıkarım\"):</strong> Dükkandan çıktıklarında <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a> malzemeleri görünce bunun sıradan bir şeytan çıkarma değil, <a class=\"entity-link\" href=\"#kural-aktarimsal-arindirim\" data-route=\"kural-aktarimsal-arindirim\">Aktarımsal Arındırım (Yansıtmacı Çıkarım)</a> ritüeli olduğunu anlar. İblisin 40 yıl sonra geri dönmesini engellemek için bedenden çıkarken kan akıtılarak önce geçici bir konağa, oradan da kil testinin içine hapsedilmesi gerekmektedir. Alarik, getirdiği <a class=\"entity-link\" href=\"#kural-godwin-haten-maniple\" data-route=\"kural-godwin-haten-maniple\">Godwin Haten'in Maniplesi</a>'nin de bu ritüelin parçası olduğunu çözer. Samuel, eli titreyerek de olsa ritüeli kendisinin tamamlayabileceğini söyler.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b2-s5\">Sahne 5: Canavar Mağarası Tavernası, Tiefling Falkret ve Kör Kuyu</h3>\n            <p>Akşamüstü 16:30 sularında ambarların arkasındaki <a class=\"entity-link\" href=\"#loc-canavar-magarasi\" data-route=\"loc-canavar-magarasi\">Canavar Mağarası Tavernası</a>'na giderler. Kapıda devasa yarı-ork <a class=\"entity-link\" href=\"#npc-krasor\" data-route=\"npc-krasor\">Krasor</a> durmaktadır; Alarik yarı-orka selam bile vermeden içeri girer. İçeride şık bir İmparatorluk beyefendisi gibi giyinmiş, tek boynuzu kırık ve törpülü Tiefling patron <a class=\"entity-link\" href=\"#npc-falkret\" data-route=\"npc-falkret\">Falkret</a> onları üst kattaki odasına alır.</p>\n\n            <ul>\n              <li><strong>Zar Kontrolü — Insight (11 + 7 = 18) & Perception (6 + 7 = 13):</strong> Falkret, 10 yıllık dostu olan Rahip Martin'in dün burada sırtını duvara vererek 50 dakika boyunca gergin şekilde birini beklediğini, sadece su içtiğini, kimse gelmeyince çıkmadan önce arka pencereden kör sokaktaki <strong>kapatılmış kuyuya</strong> uzun uzun bakıp ayrıldığını anlatır.</li>\n              <li><strong>\"Aşiyan\" Şifresinin Çözülüşü:</strong> Alarik, başkent görmüş ve edebiyattan anlayan Falkret'e bölgede bir <strong>\"Aşiyan\" (Kuş Yuvası)</strong> olup olmadığını sorar. Falkret düğümü çözer: Buraya 1–1,5 günlük mesafede, <a class=\"entity-link\" href=\"#loc-kemikli-koru\" data-route=\"loc-kemikli-koru\">Kemikli Koru</a> yakınlarında <a class=\"entity-link\" href=\"#loc-cygnus-konagi\" data-route=\"loc-cygnus-konagi\">Cygnus (Signus) Konağı</a> vardır; tarihte İmparator orada konakladığı için Aşiyan olarak bilinir ve son varisi 40'larında yalnız bir kadın olan <a class=\"entity-link\" href=\"#npc-gabriana-cygnus\" data-route=\"npc-gabriana-cygnus\">Lady Gabriana Cygnus</a>'tur!</li>\n              <li><strong>Şifrenin Tam Karşılığı:</strong>\n                <ul>\n                  <li><em>\"Yığınların arasında denkleş\"</em> → Tepeli Ambar kasabası.</li>\n                  <li><em>\"Kemikten kuş yuvasındaki\"</em> → Kemikli Koru'daki Aşiyan (<a class=\"entity-link\" href=\"#loc-cygnus-konagi\" data-route=\"loc-cygnus-konagi\">Cygnus Konağı</a>).</li>\n                  <li><em>\"Zehirlenen anne kuşu kustur, kusmuğunu sakla\"</em> → Kuğu armalı Cygnus Hanesi'nin leydisinin içindeki iblisi <a class=\"entity-link\" href=\"#kural-aktarimsal-arindirim\" data-route=\"kural-aktarimsal-arindirim\">Aktarımsal Arındırım</a> ile kusturup kil testiye hapset!</li>\n                </ul>\n              </li>\n              <li><strong>Kör Sokaktaki Kuyu — Zar Kontrolü: Investigation (8 + 5 = 13) & Perception (16 + 7 = 23):</strong> Alarik, Haldo ve Samuel'i mezarlığa gönderdikten sonra tavernanın arkasındaki kör sokakta bulunan ve artık fosseptik çukuru olarak kullanılan eski kuyuyu fenerle inceler; olağandışı bir iz bulamaz ve su fıçısında temizlenir.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b2-s6\">Sahne 6: Yüzbaşı Velmut, Cygnus Hanesi ve Marinette Sermon'un Ziyareti</h3>\n            <p>Gece kasabada devriye gezen Alarik (<strong>Şans Zarı d100: 32</strong>), mavi-beyaz üniformalı paralı askerlerin komutanı topal <a class=\"entity-link\" href=\"#npc-velmut\" data-route=\"npc-velmut\">Yüzbaşı Velmut</a> ile karşılaşır.</p>\n\n            <ul>\n              <li><strong>Yüzbaşı Velmut ile İşbirliği:</strong> <strong>Lord Ferdinand Larvos</strong>'un kanunuyla kasabadaki tüm kervan muhafızlarını denetleyen Velmut, sabahki olaydan sonra <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'ya ulak gönderdiğini bildirir. Alarik ondan dün geceki yolcu arabasını ve sabah rahiple kahvaltı yapan kervan muhafızlarını bulup mezarlığa göndermesini, ayrıca <em>\"geri dönene kadar meydana bir darağacı çaktırmasını\"</em> ister.</li>\n              <li><strong>Cygnus Hanesi Bilgisi:</strong> Mezarlıkta <a class=\"entity-link\" href=\"#npc-welford\" data-route=\"npc-welford\">Welford</a>, eski bir armalar kitabından Cygnus Hanesi'nin armasını (mor-gri zemin üzerinde <strong>kuğu üstünde şövalye</strong>) ve mottosunu (<strong>\"Elegantissima Victoria\"</strong> — <em>Zarif bir zaferle</em>) gösterir; akrabalarının miras için akbaba gibi Lady'nin ölmesini beklediğini anlatır.</li>\n              <li><strong>Gece Yarısı Ziyaretçisi — Marinette Sermon:</strong> Gece yarısı kulübenin kapısı çalınır; ölüm döşeğindeki muhtar <a class=\"entity-link\" href=\"#npc-richmund-sermon\" data-route=\"npc-richmund-sermon\">Richmund Sermon</a>'un 20'lerindeki çilli genç eşi <a class=\"entity-link\" href=\"#npc-marinette-sermon\" data-route=\"npc-marinette-sermon\">Marinette Sermon</a> (kızlık soyadı Marlov) at arabasıyla gelmiştir.\n                <ul>\n                  <li><strong>Zar Kontrolü — Insight (Ear for Deceit: 8 + 7 = 15) -> Intimidation (Avantajlı: 16 + 5 = 21) -> Insight (16 + 7 = 23):</strong> Alarik'in <em>\"Kendime acımıyorum ki başka birine acıyayım\"</em> tehdidi karşısında Marinette gerçeği itiraf eder: Acı çeken (ve kendisine kötülüğü dokunmuş) yaşlı kocasını öldürme günahını işlemek üzereyken dün gece arabada Rahip Martin'e danışmış ve sonunda vazgeçmiştir.</li>\n                  <li><strong>Kritik İpucu:</strong> Marinette, arabada konuşurlarken Rahip Martin'in bir anda arabanın penceresinden dışarıya <strong>sanki biri ona seslenmiş gibi</strong> baktığını, ardından yüzünde hoş bir gülümseme belirdiğini ve bütün gerginliğinin o anda geçtiğini söyler!</li>\n                </ul>\n              </li>\n              <li><strong>Kervan Muhafızları ve At Arabası (Insight: Doğal 20 + 7 = 27):</strong> Sabaha karşı Velmut'un gönderdiği üç kervan muhafızı gelir. Tamamen masum oldukları anlaşılır; Samuel'in yolda ritüele çalışabilmesi için muhafızlardan <strong>tenteli bir at arabası</strong> temin edilir.</li>\n            </ul>\n        "
            },

                  "html": "\n            <div class=\"module-banner\">\n              <div class=\"eyebrow\">İz Peşinde • Oyun Yöneticisi Modülü • 3. Oturum</div>\n              <h2>Bölüm 3: Tedavi</h2>\n              <p class=\"subtitle\">Kemikli Koru'ya Yolculuk, Cygnus Konağı'ndaki İblis ve Aktarımsal Arındırım Ritüeli</p>\n            </div>\n\n            <div class=\"callout\">\n              <div class=\"callout-title\">Ritüel Mekaniği: Aktarımsal Arındırım (Transfusion Exorcism)</div>\n              <p>Bu bölümün merkezinde <a class=\"entity-link\" href=\"#kural-aktarimsal-arindirim\" data-route=\"kural-aktarimsal-arindirim\">Aktarımsal Arındırım</a> ritüeli yer alır. Sıradan bir kovma işlemi iblisi yalnızca 40 yıllığına uzaklaştırırken, bu ritüel varlığı gümüş tel ve kan akışı üzerinden önce ikincil bir canlı konağa (yeme), oradan da mühürlü bir kil testiye hapseder. Ritüel sırasında DM yüzdelik (<code>d100</code>) çıkarma zarları ve <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a> için <code>d20</code> irade savaşları oynatır.</p>\n            </div>\n\n            <h2 class=\"section-title\">Bölüm Akışı</h2>\n\n            <h3 class=\"scene-title\" id=\"b3-s1\">Sahne 1: Şafak Cenazesi ve Kemikli Koru'ya Yolculuk</h3>\n            <p>Şafak vakti <a class=\"entity-link\" href=\"#loc-tepeli-ambar-mezarligi\" data-route=\"loc-tepeli-ambar-mezarligi\">Tepeli Ambar Mezarlığı</a>'nda <a class=\"entity-link\" href=\"#npc-rahip-martin\" data-route=\"npc-rahip-martin\">Gezgin Rahip Martin</a> toprağa verilir. <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>, hocasının mezarı başında gözyaşlarıyla dua eder:</p>\n\n            <div class=\"read-aloud\">\n              \"Tanrıların merhameti üzerine olsun Peder. Yürüdüğün yollar boyunca derman olduğun her kul şahidindir; şimdi dinlenme vaktidir...\"\n            </div>\n\n            <ul>\n              <li><strong>Alarik'in İntikam Yemini:</strong> <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>, taze mezar toprağına elini sokarak <em>\"Yoluna taş koyanın başını taşla ezeceğim\"</em> diye yemin eder.</li>\n              <li><strong>Zar Kontrolü — Survival (Avantajlı: Doğal 20 + 5 = 25):</strong> İki atın koşulduğu tenteli arabayla yola çıkarlar; Alarik kusursuz bir iz sürmeyle en güvenli ve hızlı rotayı bulur.</li>\n              <li><strong>Kamp Ateşi Başında Sırlar ve Emanet Teslimi:</strong>\n                <ul>\n                  <li><strong>Zar Kontrolü — Insight (10 + 7 = 17):</strong> Samuel, 5 yıl önce <strong>Kırgeçit</strong> kasabasında iblis musallat olan 7 çocuktan 6'sının bizzat <a class=\"entity-link\" href=\"#npc-godfrey\" data-route=\"npc-godfrey\">Avcı Kaptan Godfrey</a> tarafından infaz edildiğini, yalnızca kendisinin Rahip Martin'in kefaletiyle kurtulduğunu anlatır.</li>\n                  <li><strong>Zar Kontrolü — Religion (Dezavantajlı: 3/5 -> Inspiration ile 20/11 -> 11 + 5 = 16) & Insight (17):</strong> Alarik, Samuel'e <a class=\"entity-link\" href=\"#kural-abyssal\" data-route=\"kural-abyssal\">Abyssal (Düşmanın Dili)</a> bildiğini açıklayıp bu sırrı mezara götürmesi için yemin ettirir ve tabanca kutusunda sakladığı <a class=\"entity-link\" href=\"#kural-godwin-haten-maniple\" data-route=\"kural-godwin-haten-maniple\">Şehit Rahip Godwin Haten'in Maniplesi</a>'ni Samuel'e teslim eder. İkisi de ölürlerse cesetlerinin ne yapılacağına dair karşılıklı vasiyette bulunurlar.</li>\n                </ul>\n              </li>\n              <li><strong>Marsık Deresi ve Kemikli Koru (Survival Avantajlı: 22):</strong> Ertesi gün pis kokulu, iri sinekli <a class=\"entity-link\" href=\"#loc-marsik-deresi\" data-route=\"loc-marsik-deresi\">Marsık Deresi</a>'ni ve bembeyaz, kemik gibi huş ağaçlarıyla kaplı <a class=\"entity-link\" href=\"#loc-kemikli-koru\" data-route=\"loc-kemikli-koru\">Kemikli Koru</a>'yu geçerek <a class=\"entity-link\" href=\"#loc-cygnus-konagi\" data-route=\"loc-cygnus-konagi\">Cygnus Konağı</a>'na ulaşırlar.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b3-s2\">Sahne 2: Cygnus Konağı, Kahya Pietro ve Lady Gabriana ile Yüzleşme</h3>\n            <p><strong>Zar Kontrolü — Perception (16 + 7 = 23):</strong> Koru içindeki <a class=\"entity-link\" href=\"#loc-cygnus-konagi\" data-route=\"loc-cygnus-konagi\">Cygnus Konağı</a>, eski bir taş gözetleme kulesi ve ona bitişik iki katlı bakımsız ahşap bir konaktan oluşmaktadır. Kapıyı yaşlı ve aksak yürüyen sadık kahya <a class=\"entity-link\" href=\"#npc-pietro\" data-route=\"npc-pietro\">Pietro</a> açar.</p>\n\n            <ul>\n              <li><strong>Kahya Pietro'nun Anlattıkları — Zar Kontrolü: Insight (17 + 7 = 24):</strong> Eski Lord ve Lady yıllar önce bir av kazasında öldükten sonra Pietro, ikiz çocuklar <strong>Gabriel Cygnus</strong> ve <a class=\"entity-link\" href=\"#npc-gabriana-cygnus\" data-route=\"npc-gabriana-cygnus\">Gabriana Cygnus</a>'u tek başına büyütmüştür. Genç yaşta <strong>Gabriel</strong> bahçedeki ağaca kendini asarak intihar etmiş, Lady Gabriana ise son 3 yıldır odasında eriyip bitmektedir. Pietro yıllarca durumu akrabalarından gizleyip inkâr içinde yaşamıştır (<em>DM Notu: Oturumda DM'in isim sürçmesi nedeniyle oyuncuya +1 Inspiration verilmiştir</em>).</li>\n              <li><strong>Lady Gabriana ve İfrit ile Yüzleşme:</strong>\n                <ul>\n                  <li><strong>Zar Kontrolü — Insight (7 + 7 = 14 -> Inspiration ile 20 + 7 = 27) & Perception (14):</strong> Giriş kattaki ağır kokulu, pencereleri kapalı odada yer şiltesinde yatan <a class=\"entity-link\" href=\"#npc-gabriana-cygnus\" data-route=\"npc-gabriana-cygnus\">Lady Gabriana</a> bir deri bir kemik kalmıştır; tırnakları kırık, saçları keçeleşmiştir ve kendi kendine mırıldanmaktadır.</li>\n                  <li><strong>Zar Kontrolü — Insight (12 + 7 = 19 ve 19 + 7 = 26):</strong> <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Haldo</a> kadını zapt ederken Alarik doğrudan <a class=\"entity-link\" href=\"#kural-abyssal\" data-route=\"kural-abyssal\">Abyssal</a> dilinde kadının içindeki varlığa seslenir. Gabriana'nın sesi kalınlaşıp çatallaşır; içindeki <a class=\"entity-link\" href=\"#npc-cygnus-ifriti\" data-route=\"npc-cygnus-ifriti\">Cygnus İfriti</a> kendi dilinde alayla yanıt verir:</li>\n                </ul>\n              </li>\n            </ul>\n\n            <div class=\"read-aloud\">\n              \"Hiçbir şey yapamazsınız! Yıllardır buradayım, kök saldım! O yaşlı rahip de gelemedi, bu çelimsiz çocuk mu beni çıkaracak? Gabriana sonsuza kadar benimle beraber!\"\n            </div>\n\n            <h3 class=\"scene-title\" id=\"b3-s3\">Sahne 3: Bahçedeki Yarık Huş Ağacı ve Kahya Pietro'nun Yem Olması</h3>\n            <p>Alarik iblisin konağa nasıl girdiğini anlamak için arka bahçeyi inceler.</p>\n\n            <ul>\n              <li><strong>Zar Kontrolü — Perception (14 + 7 = 21) & Investigation (19 + 5 = 24):</strong> Bahçenin ortasında devasa, burgu gövdeli beyaz bir huş ağacı yükselmektedir. Ağacın bir dalında eski bir çocuk salıncağı, diğer dalında ise ikiz kardeş <strong>Gabriel'in kendini astığı kesik urgan</strong> sallanmaktadır. Gövdenin tam ortasında yıldırım düşmesiyle açılmış gibi duran siyah bir yarık vardır; yarıktan sülfür ve çürük et kokusu gelmektedir. Alarik yarığa kutsal su döktüğünde siyah doku yüksek sesle tıslar (iblisin düzleme sızdığı çatlak burasıdır).</li>\n              <li><strong>Kedi Yerine İnsan Yem — Zar Kontrolü: Persuasion (12 + 3 = 15) & Insight (19):</strong> Ritüelde iblisi testiye çekmek için normalde kedi gibi küçük bir hayvan yem olarak kullanılır. Ancak Alarik, yıllardır kök salmış bu güçlü ifritin sıradan bir kediye kanmayacağını düşünerek <a class=\"entity-link\" href=\"#npc-pietro\" data-route=\"npc-pietro\">Kahya Pietro</a>'yu geçici konak (yem) olarak kullanmayı önerir! Başta dehşete düşen <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>'i ikna eder; Pietro ise yıllarca leydisini koruyamamanın suçluluğu ve sadakatiyle ölmeye gönüllü olur.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b3-s4\">Sahne 4: Aktarımsal Arındırım Ritüeli, Üçlü Trajedi ve Konağın Yakılması</h3>\n            <p>Konak odasında zemin temizlenir: Saf tuz ve gümüş tozuyla iç içe geçmiş iki çember çizilir. Büyük çemberde fokurdayan bitkili kazan üzerine <a class=\"entity-link\" href=\"#npc-gabriana-cygnus\" data-route=\"npc-gabriana-cygnus\">Lady Gabriana</a> baş aşağı/eğik şekilde asılır; küçük çemberde ise bağlı <a class=\"entity-link\" href=\"#npc-pietro\" data-route=\"npc-pietro\">Kahya Pietro</a> ve ağzı açık kil testi yer alır. İki çember arasına gümüş telden bir \"şalter\" çekilir.</p>\n\n            <ul>\n              <li><strong>Ritüelin Adım Adım Zarları ve Trajik Sonuç:</strong>\n                <ol>\n                  <li><strong>Hazırlık — Insight (13 + 7 = 20):</strong> <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a> koluna <a class=\"entity-link\" href=\"#kural-godwin-haten-maniple\" data-route=\"kural-godwin-haten-maniple\">Godwin Haten'in Maniplesi</a>'ni sarar ve dualara başlar; Gabriana'nın kesilen yerlerinden kazan üstüne siyahımsı kan damlar.</li>\n                  <li><strong>1. Çıkarma Zarı (d100: 41 vs Eşik ≤ 30 — Başarısız):</strong> İfrit direnir, oda buz keser, Samuel kan ter içinde kalır.</li>\n                  <li><strong>2. Çıkarma Zarı (d100: 42 vs Eşik ≤ 45 — Başarılı!):</strong> Gabriana'nın ağzından ve kanından yükselen yoğun siyah duman (<a class=\"entity-link\" href=\"#npc-cygnus-ifriti\" data-route=\"npc-cygnus-ifriti\">Cygnus İfriti</a>) bedenden sökülür! Ancak duman gümüş tel üzerinden akarken ikiye bölünerek hem yem olan Pietro'ya hem de ritüeli yöneten Samuel'e saldırır!</li>\n                  <li><strong>Samuel 1. İrade Savaşı (d20: 9 vs DC 11 — Başarısız):</strong> İfrit Samuel'in zihnine yüklenir. Samuel ritüeli kurtarmak için bıçağı alıp kendi bileğini keser ve kanını doğrudan kil testinin içine akıtır!</li>\n                  <li><strong>Samuel 2. İrade Savaşı (d20: 6 vs DC 11 — Başarısız):</strong> Alarik tuz çemberini bozma pahasına içeri atlayıp Samuel'e sarılarak <a class=\"entity-link\" href=\"#kural-abyssal\" data-route=\"kural-abyssal\">Abyssal</a> dilinde <em>\"Buradayım, bana gel!\"</em> diye bağırarak iblisi kendi üzerine çekmeye çalışır. Ancak önce yaşlı <a class=\"entity-link\" href=\"#npc-pietro\" data-route=\"npc-pietro\">Pietro</a>'nun kalbi durur, hemen ardından <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a> son nefesinde iblisi tamamen testinin içine çekip boynundaki kutsal sembolü Alarik'e uzatarak <em>\"Beni Peder'in yanına gömün...\"</em> der ve Alarik'in kollarında şehit düşer!</li>\n                  <li><strong>Testinin Mühürlenmesi — Religion (Avantajlı: 19 + 7 = 26):</strong> Alarik ve <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Haldo</a>, balmumu, gümüş tozu ve Godwin Haten'in Maniplesi ile kil testiyi kusursuzca mühürlerler.</li>\n                  <li><strong>Lady Gabriana'nın Hayatta Kalma Zarı (d20: 2 — Başarısız):</strong> İçindeki ifritten kurtulan <a class=\"entity-link\" href=\"#npc-gabriana-cygnus\" data-route=\"npc-gabriana-cygnus\">Lady Gabriana</a>, üç yıllık erimenin ve ritüeldeki kan kaybının yükünü kaldıramayarak birkaç dakika içinde sessizce can verir.</li>\n                </ol>\n              </li>\n              <li><strong>Konağın Aranması ve Yakılması:</strong> Alarik konağı arar; üst katta kurumuş bir <strong>Cygnus mührü</strong> ve aile tablosu bulur (değerli her şey yıllar önce satılmıştır). Lady Gabriana ve Kahya Pietro bahçeye gömülür; yarık huş ağacı ve konak ateşe verilerek tamamen yakılır. Dış kapıya Engizisyon mühürlü karantina ve el koyma hükmü çivilenir. Samuel'in naaşı arabaya yüklenerek dönüş yoluna geçilir.</li>\n            </ul>\n        "

                  "html": "\n            <div class=\"module-banner\">\n              <div class=\"eyebrow\">İz Peşinde • Oyun Yöneticisi Modülü • 4. Oturum</div>\n              <h2>Bölüm 4: Tahsilat</h2>\n              <p class=\"subtitle\">Mühürlü Testinin Peşindeki Güçler: Gayri Müsellah Azizler, Beyaz Şehir'in Ulağı ve Yüksek Piskopos Caligus</p>\n            </div>\n\n            <div class=\"callout\">\n              <div class=\"callout-title\">Bölümün Ana Gerilimi: Testiyi Kim İstiyor?</div>\n              <p style=\"margin-bottom:0;\"><a class=\"entity-link\" href=\"#loc-cygnus-konagi\" data-route=\"loc-cygnus-konagi\">Cygnus Konağı</a>'ndaki ritüel tamamlanır tamamlanmaz, mühürlü kil testiyi (\"kusmuğu\") teslim almak üzere üç farklı güç odağı peş peşe <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a>'in karşısına çıkar: (1) <a class=\"entity-link\" href=\"#kural-gayri-musellah-azizler\" data-route=\"kural-gayri-musellah-azizler\">Gayri Müsellah Azizler</a> tarikatından <a class=\"entity-link\" href=\"#npc-vernon-carlin\" data-route=\"npc-vernon-carlin\">Sör Vernon Carlin</a>, (2) \"Beyaz Şehir'deki çok yaşlı birileri\" adına hareket eden <a class=\"entity-link\" href=\"#npc-ulak-konrad\" data-route=\"npc-ulak-konrad\">Ulak Konrad</a> ve (3) bizzat <a class=\"entity-link\" href=\"#npc-piskopos-caligus\" data-route=\"npc-piskopos-caligus\">Yüksek Piskopos Manus Landebert Adrein Caligus</a>. Alarik hiçbirine testiyi vermez.</p>\n            </div>\n\n            <h2 class=\"section-title\">Bölüm Akışı</h2>\n\n            <h3 class=\"scene-title\" id=\"b4-s1\">Sahne 1: Dönüş Yolu, Haldo'nun Günahı ve Gaius Morden Rüyası</h3>\n            <p>Konağın dumanları arkada yükselirken ekip <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>'in naaşı ve mühürlü testiyle dönüş yoluna geçer (<strong>Insight: 17</strong> & <strong>Survival Avantajlı: 11 + 5 = 16</strong>). Her zaman sert olan <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Haldo</a>, Samuel'in naaşını beklenmedik bir şefkatle taşır ve <em>\"Keşke...\"</em> diye mırıldanır.</p>\n\n            <ul>\n              <li><strong>Haldo'nun Büyük Günahı (Kamp Ateşi İtirafı):</strong> Gece kampında Haldo ilk kez hangi günahın kefaretini ödediğini anlatır: Gençliğinde odunculuk yaparken kasabın güzel kızı <strong>Julia</strong> ile evlenmiştir. Ancak ağabeyi <strong>Halder</strong> ile karısı arasında bir ilişki olduğuna dair fısıltılar yüzünden içine düşen <strong>kuşku</strong> ile bir gece ispirto içip baltayla hem karısını hem ağabeyini doğramıştır. Yıllar sonra bir handa, o dedikoduyu sırf eğlencesine uydurduğunu gülerek anlatan sarhoş bir tüccara rastlamış; tüccarı çıplak elleriyle parçaladıktan sonra <em>\"bir daha asla şüphe duymamak ve yanılmamak için\"</em> Engizisyon'a Mücahit (Yobaz) olarak katılmıştır.</li>\n              <li><strong>Alarik'in Vaazı (Insight: 7 + 6 = 13):</strong> Alarik, Haldo'ya <em>\"Merhametin fazlasından maraz doğar... Yüreğindeki o üzüntüyü öfkeye çevir; Samuel'in kanı Peder Martin'i öldürenin elindedir\"</em> diyerek onu yeniden vazifeye kenetler.</li>\n              <li><strong>Testinin Fısıltısı ve Rüya — Zar Kontrolü: Wisdom Save (12) & Wisdom Check (14 + 3 = 17):</strong> Gece mühürlü testinin yakınında uyuyan Alarik tekinsiz bir rüya görür: 6 yaşında <a class=\"entity-link\" href=\"#loc-variana-yetimhanesi\" data-route=\"loc-variana-yetimhanesi\">Azize Variana Yetimhanesi</a>'nde, <a class=\"entity-link\" href=\"#npc-gaius-morden\" data-route=\"npc-gaius-morden\">Peder Gaius Morden</a>'in odasında ayağında çamurlu büyük botlarla uyanır. Karşısındaki Gaius'un şehla olan sağ gözünden siyah zift/kan damlamaktadır ve Gaius ona şöyle der:</li>\n            </ul>\n\n            <div class=\"read-aloud\">\n              \"Unutma Alarik... En karanlık ruhların bile af dilenebileceği bir yere ihtiyacı vardır.\"\n            </div>\n\n            <h3 class=\"scene-title\" id=\"b4-s2\">Sahne 2: Gece Yarısı İlk Ziyaretçi — Gayri Müsellah Azizler ve Sör Vernon Carlin</h3>\n            <p>Gece saat 02:00 sularında kamp ateşine doğru iki atlı yaklaşır. Alarik derhal çalılara gizlenir.</p>\n\n            <ul>\n              <li><strong>Zar Kontrolü — Stealth (15 + 6 = 21 ve 13 + 6 = 19) & Perception (9 ve 10):</strong> Gelenlerden biri kampın önünde dururken, genç yaveri <a class=\"entity-link\" href=\"#npc-jorel\" data-route=\"npc-jorel\">Jorel</a> eyerin üzerinde uyuklamaktadır. Alarik karanlığın içinden sessizce dolanıp Jorel'in şakağına tabancasını dayar.</li>\n              <li><strong>Sör Vernon Carlin ve Gayri Müsellah Azizler:</strong>\n                <ul>\n                  <li><strong>Zar Kontrolü — Insight (14 + 7 = 21) & Religion (13 + 5 = 18) & History (Dezavantajlı: 4 + 3 = 7):</strong> Öndeki devasa şövalye <a class=\"entity-link\" href=\"#npc-vernon-carlin\" data-route=\"npc-vernon-carlin\">Sör Vernon Carlin</a>, ellerini kaldırıp tamamen dürüst ve sakin bir tavırla konuşur. Göğüs zırhında <strong>üç kılıç ayaklı kazan</strong> sembolü ve <strong>\"Hic est sanctuarium meum\"</strong> (<em>Mabedim burası</em>) yazısı vardır.</li>\n                  <li>Bu sembol, <a class=\"entity-link\" href=\"#kural-amarath\" data-route=\"kural-amarath\">Amarath</a> inancının radikal bir kolu olan <a class=\"entity-link\" href=\"#kural-gayri-musellah-azizler\" data-route=\"kural-gayri-musellah-azizler\">Gayri Müsellah Azizler</a> tarikatına aittir: Bu şövalyeler savaş meydanı dışında asla silah taşımaz (tüm silahlarını yaverleri taşır), hiçbir tapınağa bağlanmaz ve kendi bedenlerini mabet sayan gezgin akolitler olarak yaşarlar.</li>\n                </ul>\n              </li>\n              <li><strong>Talebin Reddi:</strong> Sör Vernon, <a class=\"entity-link\" href=\"#loc-brevista\" data-route=\"loc-brevista\">Brevista</a>'daki <strong>Larvos Hanesi</strong> düğününe giderken Rahip Martin'in düştüğünü duyup emaneti (testiyi) teslim almaya geldiğini söyler. Alarik, Engizisyon prosedürü gereği emaneti yalnızca kendi üstlerine teslim edeceğini söyleyerek talebi reddeder ve onu <a class=\"entity-link\" href=\"#loc-kan-degirmeni\" data-route=\"loc-kan-degirmeni\">Kan Değirmeni Karakolu</a>'na yönlendirir. Vernon, <em>\"Merhamet yüreğe ağırlık verir, kaldıramayan yürekler için özellikle\"</em> diyerek saygıyla ayrılır.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b4-s3\">Sahne 3: Samuel'in Defni, Ulak Konrad ve Altın Nota Tavernası</h3>\n            <p>Ertesi gün <a class=\"entity-link\" href=\"#loc-tepeli-ambar-mezarligi\" data-route=\"loc-tepeli-ambar-mezarligi\">Tepeli Ambar Mezarlığı</a>'na dönerler. <a class=\"entity-link\" href=\"#npc-welford\" data-route=\"npc-welford\">Welford</a>, önceden üç mezar kazmıştır (<em>\"Genelde bir cesetle giden birkaç cesetle döner\"</em>). Rahip Martin'in mezar taşına <strong>\"Mundus minus misericors est\"</strong> (<em>Dünya artık daha az merhametli</em>) yazılmıştır. Alarik, Martin'in 27 altınından mezar masraflarını öder; <a class=\"entity-link\" href=\"#npc-haldo\" data-route=\"npc-haldo\">Haldo</a> kendi kutsal suyuyla <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>'i hocasının yanına defneder.</p>\n\n            <ul>\n              <li><strong>İkinci Ziyaretçi — Ulak Konrad:</strong> Gece mezarlık kulübesinin kapısı kibarca çalınır. Karşılarında yüzünde hiçbir ayırt edici özellik bulunmayan, bıyıklı ve centilmen tavırlı <a class=\"entity-link\" href=\"#npc-ulak-konrad\" data-route=\"npc-ulak-konrad\">Ulak Konrad</a> durmaktadır (<strong>Insight: 13</strong>).\n                <ul>\n                  <li>Konrad, <strong>\"Beyaz Şehir'deki (Sanctuary) çok yaşlı birileri\"</strong> adına Brevista'daki düğüne giderken uğradığını ve Alarik'in elindeki <em>\"koyu renkli, kokan bayat şarap testisini\"</em> teslim almaya geldiğini söyler. Alarik onu da kesin bir dille reddeder.</li>\n                </ul>\n              </li>\n              <li><strong>Gizli Takip — Zar Kontrolü: Stealth (17 + 6 = 23):</strong> Konrad mezarlık kapısından çıktığı anda <strong>yürüyüşü, adım sıklığı, omuz açısı ve duruşu tamamen değişir</strong> (profesyonel bir kılık/kimlik değiştirici veya ajan olduğu anlaşılır). Alarik karanlıkta onu izler; Konrad kasabanın en lüks hanı olan <a class=\"entity-link\" href=\"#loc-altin-nota\" data-route=\"loc-altin-nota\">Altın Nota Tavernası</a>'na girip oda tutar ve yanına bir fahişe alarak odasına çıkar.</li>\n              <li><strong>Hancı Leroy ve \"Gece\" Şarabı:</strong> Alarik tavernaya girip zengin hancı <a class=\"entity-link\" href=\"#npc-leroy\" data-route=\"npc-leroy\">Leroy</a> ile konuşur. Konrad'ın ağzını arar ve Larvos düğünü hakkında bilgi alır. Engizisyon avcısına hürmet eden Leroy, Alarik'e bedava yol azığı (otlu kokulu peynir, yemişli pastırma) ve işlemeli cam şişede yıllanmış <strong>\"Gece\" şarabı</strong> hediye eder. Alarik mezarlığa dönüp şarabı Welford ve Haldo ile çay bardaklarında paylaşır.</li>\n            </ul>\n\n            <h3 class=\"scene-title\" id=\"b4-s4\">Sahne 4: Sör Alvin Bereketsoy, Yüksek Piskopos Caligus ve Godfrey'in Sürgünü</h3>\n            <p>Ertesi gün <a class=\"entity-link\" href=\"#loc-kan-degirmeni\" data-route=\"loc-kan-degirmeni\">Kan Değirmeni Karakolu</a>'na dönüş yolunda, karakola 1,5 saatlik mesafe kala beyaz atlı, tam plaka zırhlı bir şövalye yolu keser: <a class=\"entity-link\" href=\"#npc-alvin-bereketsoy\" data-route=\"npc-alvin-bereketsoy\">Sör Alvin Bereketsoy</a>.</p>\n\n            <ul>\n              <li><strong>Zar Kontrolü — History (19 + 3 = 22):</strong> Soylu bir aileden gelmeyip sonradan liyakat ve kahramanlıkla şövalye ilan edilen Amarath şövalyelerine <em>Bereketsoy, Rahmettutan, Hikmetyol</em> gibi soyadları verilir.</li>\n              <li><strong>Okuma-Yazma Oyunu:</strong> Sör Alvin, <a class=\"entity-link\" href=\"#npc-piskopos-caligus\" data-route=\"npc-piskopos-caligus\">Yüksek Piskopos Manus Landebert Adrein Caligus</a> imzalı resmi belgeyi uzatarak testiyi talep eder. Alarik belgeyi baştan sona dikkatle okuduktan sonra yüzünde alaycı bir ciddiyetle belgeyi geri uzatır:\n                <div class=\"read-aloud\" style=\"margin:10px 0;\">\n                  \"Heyhat! Unutmuş olmalıyım ki benim okumam yok. Haldo, senin okuman var mı?\"\n                </div>\n                Böylece yazılı emri \"okuyamadığı\" gerekçesiyle şövalyeyi atlatıp hızla karakola varır.\n              </li>\n              <li><strong>Yüksek Piskopos'un Karakol Baskını:</strong>\n                <ul>\n                  <li><strong>Zar Kontrolü — History (18 + 3 = 21) & Religion (12 + 7 = 19):</strong> Lejyon kökenli soylu Caligus ailesinden gelen Piskopos, adını iki büyük din büyüğünden almıştır: Ailesini katleden şövalyeyi affeden aziz <em>Landebert</em> ve Başrahip Hefter döneminde kendini siper eden Sunak Şehitlerinden <em>Adrein</em>.</li>\n                  <li><a class=\"entity-link\" href=\"#npc-godfrey\" data-route=\"npc-godfrey\">Vekil Kumandan Godfrey</a> derhal alarm verir, kuzgunlar uçurulur ve Batı Kalkanı soylusu işkence uzmanı <a class=\"entity-link\" href=\"#npc-jaret-von-dafflin\" data-route=\"npc-jaret-von-dafflin\">Avcı Kaptan Jaret von Dafflin</a> dahil tüm avcılar avluda toplanır.</li>\n                  <li>Piskopos Caligus; altın-gümüş işlemeli iki araba, Sör Alvin ve 8 tam zırhlı şövalyeyle karakola girer (<em>\"Salus militibus, venatoribus, et iis qui manus sordidare non metuunt\"</em> — Askerlere, avcılara ve ellerini kirletmekten korkmayanlara selam olsun). Yobazlar vecde gelip ağlaşırken avcılar elleri silahlarda şövalyeleri kuşatır.</li>\n                  <li><strong>Zar Kontrolü — Insight (23):</strong> Godfrey üst katta Piskopos ile 20 dakika baş başa görüşür ve testiyi teslim etmeyi reddeder! Piskopos büyük bir öfkeyle karakoldan ayrılır.</li>\n                </ul>\n              </li>\n              <li><strong>Terfi Kisvesi Altında Sürgün:</strong> Baskından birkaç gün sonra başkent Sanctuary'den bir <strong>Ulak Sorguç</strong> gelir: <a class=\"entity-link\" href=\"#npc-godfrey\" data-route=\"npc-godfrey\">Pınaryurtlu Godfrey</a>, \"üstün hizmetlerinden ötürü\" <strong>Avcı Komutan</strong> rütbesine terfi ettirilmiş ve kuzeydeki <strong>Kurt İni'nin güneyinde yer alan İkinci Geçit Karakolu'na</strong> atanmıştır (açık bir siyasi sürgün).</li>\n            </ul>\n        "
