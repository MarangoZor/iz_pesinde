                  "sections": [
                        {
                              "heading": "Tarihçe, Arma ve Mimari",
                              "body": "Geçmişte bir İmparator burada konakladığı için İmparatorluk geleneğine göre <strong>'Aşiyan (Kuş Yuvası)'</strong> unvanı taşıyan eski taş kule ve iki katlı ahşap konaktır. Cygnus Hanesi'nin arması mor-gri zemin üzerinde <strong>kuğu üstünde şövalye</strong>, mottosu ise <strong>'Elegantissima Victoria'</strong> (<em>Zarif bir zaferle</em>)'dir."
                        },
                        {
                              "heading": "Yarık Huş Ağacı ve Konağın Yakılması (Bölüm 3)",
                              "body": "Arka bahçesindeki devasa burgu gövdeli beyaz huş ağacının bir dalında çocuk salıncağı, diğer dalında ikiz kardeş <strong>Gabriel Cygnus</strong>'un intihar urganı asılıdır; gövdesindeki yıldırım yarığından sülfür ve çürük et kokusu yayılır (<a class=\"entity-link\" href=\"#npc-cygnus-ifriti\" data-route=\"npc-cygnus-ifriti\">Cygnus İfriti</a>'nin düzleme sızdığı çatlak). 3. Bölümde <a class=\"entity-link\" href=\"#npc-gabriana-cygnus\" data-route=\"npc-gabriana-cygnus\">Lady Gabriana</a>, <a class=\"entity-link\" href=\"#npc-pietro\" data-route=\"npc-pietro\">Kahya Pietro</a> ve <a class=\"entity-link\" href=\"#npc-samuel\" data-route=\"npc-samuel\">Samuel</a>'in ölümüyle sonuçlanan ritüelin ardından <a class=\"entity-link\" href=\"#npc-kara-alarik\" data-route=\"npc-kara-alarik\">Kara Alarik</a> tarafından yarık ağaçla birlikte tamamen yakılmış ve kapısına Engizisyon karantina hükmü çivilenmiştir."

    // =========================================================================
    // NAVİGASYON, TARİHÇE YIĞINI (SCROLL KORUMALI) VE RENDER MANTIĞI
    // =========================================================================
    const navTree = document.getElementById("navTree");
    const mainContent = document.getElementById("mainContent");
    const searchInput = document.getElementById("searchInput");
    const sidebar = document.getElementById("sidebar");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");

    let currentRoute = "bolum-1";
    const navHistory = []; // { route, scrollY, title }

    function closeMobileDrawer() {
      sidebar.classList.remove("open");
      drawerBackdrop.classList.remove("open");
    }

    mobileMenuBtn.addEventListener("click", () => {
      sidebar.classList.add("open");
      drawerBackdrop.classList.add("open");
    });
    drawerBackdrop.addEventListener("click", closeMobileDrawer);

    function getRouteTitle(route) {
      const ch = ADVENTURE_DATA.chapters.find(c => c.id === route);
      if (ch) return ch.title;
      const ent = ADVENTURE_DATA.entities[route];
      if (ent) return ent.title;
      return "İz Peşinde";
    }

    function navigateTo(route, options = {}) {
      const { pushHistory = true, restoreScrollY = null, scrollTargetId = null } = options;
      if (pushHistory && route !== currentRoute) {
        navHistory.push({
          route: currentRoute,
          scrollY: window.scrollY || window.pageYOffset || 0,
          title: getRouteTitle(currentRoute)
        });
      }
      currentRoute = route;
      if (window.location.hash !== "#" + route) {
        try { history.replaceState(null, "", "#" + route); } catch (e) {}
      }
      renderMain();
      renderSidebar(searchInput.value);
      closeMobileDrawer();

      requestAnimationFrame(() => {
        if (restoreScrollY !== null) {
          window.scrollTo({ top: restoreScrollY, behavior: "instant" });
        } else if (scrollTargetId) {
          const el = document.getElementById(scrollTargetId);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          else window.scrollTo(0, 0);
        } else {
          window.scrollTo(0, 0);
        }
      });
    }

    function goBack() {
      if (navHistory.length === 0) {
        navigateTo("bolum-1", { pushHistory: false });
        return;
      }
      const prev = navHistory.pop();
      navigateTo(prev.route, { pushHistory: false, restoreScrollY: prev.scrollY });
    }

    function renderSidebar(filterText = "") {
      const q = filterText.trim().toLowerCase();
      let html = "";

      // Bölümler
      const matchingChapters = ADVENTURE_DATA.chapters.filter(c =>
        !q || c.title.toLowerCase().includes(q) || c.scenes.some(s => s.title.toLowerCase().includes(q))
      );
      if (matchingChapters.length) {
        html += `<div class="nav-group"><div class="nav-group-title">Bölümler</div>`;
        matchingChapters.forEach(ch => {
          const active = currentRoute === ch.id ? "active" : "";
          html += `<button type="button" class="nav-item ${active}" data-nav="${ch.id}">${ch.title}<span class="nav-badge">${ch.badge}</span></button>`;
          if (currentRoute === ch.id || q) {
            ch.scenes.forEach(sc => {
              if (!q || sc.title.toLowerCase().includes(q)) {
                html += `<button type="button" class="nav-sub-item" data-chapter="${ch.id}" data-scene="${sc.id}">${sc.title}</button>`;
              }
            });
          }
        });
        html += `</div>`;
      }

      // Kategoriler: NPC, Mekan, Kurallar
      const groups = [
        { key: "npc", label: "Karakterler & NPC'ler" },
        { key: "location", label: "Mekânlar" },
        { key: "rule", label: "Kurallar & Evren" }
      ];
      groups.forEach(g => {
        const items = Object.entries(ADVENTURE_DATA.entities).filter(([, ent]) =>
          ent.category === g.key && (!q || ent.title.toLowerCase().includes(q) || ent.meta.toLowerCase().includes(q))
        );
        if (items.length) {
          html += `<div class="nav-group"><div class="nav-group-title">${g.label}</div>`;
          items.forEach(([id, ent]) => {
            const active = currentRoute === id ? "active" : "";
            html += `<button type="button" class="nav-item ${active}" data-nav="${id}">${ent.title}</button>`;
          });
          html += `</div>`;
        }
      });

      if (!html) {
        html = `<div style="padding:12px;font-family:var(--font-sans);font-size:0.85rem;color:var(--muted);">Eşleşen kayıt bulunamadı.</div>`;
      }
      navTree.innerHTML = html;
    }

    function renderMain() {
      const ch = ADVENTURE_DATA.chapters.find(c => c.id === currentRoute);
      if (ch) {
        let backHtml = "";
        if (navHistory.length > 0) {
          const prev = navHistory[navHistory.length - 1];
          backHtml = `
            <div class="back-bar">
              <button type="button" class="back-btn" id="backBtn">↩ Geri Dön: ${prev.title}</button>
              <span class="breadcrumb">İz Peşinde / ${ch.title}</span>
            </div>`;
        }
        mainContent.innerHTML = backHtml + ch.html;
        return;
      }

      const ent = ADVENTURE_DATA.entities[currentRoute];
      if (ent) {
        const prev = navHistory.length > 0 ? navHistory[navHistory.length - 1] : null;
        const backLabel = prev ? `↩ Akışa Dön (${prev.title})` : "↩ Bölüm 1'e Git";

        let statsHtml = "";
        if (ent.stats && ent.stats.length) {
          statsHtml = `<div class="stat-grid">` + ent.stats.map(s => `
            <div class="stat-box">
              <div class="lbl">${s.lbl}</div>
              <div class="val">${s.val}</div>
              <div class="mod">${s.mod}</div>
            </div>`).join("") + `</div>`;
        }

        const sectionsHtml = ent.sections.map(sec => `
          <div class="detail-block">
            <h4>${sec.heading}</h4>
            <p>${sec.body}</p>
          </div>`).join("");

        const appearHtml = ent.appearances && ent.appearances.length
          ? `<div class="related-links"><strong>Geçtiği Yerler:</strong> ` +
            ent.appearances.map(a => `<a class="entity-link" href="#${a.chapterId}" data-route="${a.chapterId}">${a.label}</a>`).join(" • ") +
            `</div>`
          : "";

        mainContent.innerHTML = `
          <div class="back-bar">
            <button type="button" class="back-btn" id="backBtn">${backLabel}</button>
            <span class="breadcrumb">İz Peşinde / ${ent.title}</span>
          </div>
          <article class="entity-card">
            <div class="entity-type-tag">${ent.typeLabel}</div>
            <h2>${ent.title}</h2>
            <div class="entity-meta">${ent.meta}</div>
            ${statsHtml}
            ${sectionsHtml}
            ${appearHtml}
          </article>`;
      }
    }

    // Event Delegation
    navTree.addEventListener("click", (e) => {
      const navBtn = e.target.closest("[data-nav]");
      if (navBtn) {
        navigateTo(navBtn.getAttribute("data-nav"));
        return;
      }
      const subBtn = e.target.closest("[data-scene]");
      if (subBtn) {
        const chId = subBtn.getAttribute("data-chapter");
        const scId = subBtn.getAttribute("data-scene");
        navigateTo(chId, { pushHistory: currentRoute !== chId, scrollTargetId: scId });
      }
    });

    mainContent.addEventListener("click", (e) => {
      const link = e.target.closest("a.entity-link");
      if (link) {
        e.preventDefault();
        navigateTo(link.getAttribute("data-route"));
        return;
      }
      if (e.target.closest("#backBtn")) {
        goBack();
      }
    });

    searchInput.addEventListener("input", (e) => {
      renderSidebar(e.target.value);
    });

    window.addEventListener("hashchange", () => {
      const hash = window.location.hash.replace(/^#/, "");
      if (hash && (ADVENTURE_DATA.entities[hash] || ADVENTURE_DATA.chapters.some(c => c.id === hash))) {
        if (hash !== currentRoute) navigateTo(hash, { pushHistory: false });
      }
    });

    // İlk yükleme
    const initialHash = window.location.hash.replace(/^#/, "");
    if (initialHash && (ADVENTURE_DATA.entities[initialHash] || ADVENTURE_DATA.chapters.some(c => c.id === initialHash))) {
      currentRoute = initialHash;
    }
    renderSidebar();
    renderMain();
  </script>
</body>
</html>
